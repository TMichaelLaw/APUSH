ia Statute for Religious Freedom","The Northwest Ordinance's slavery ban","Gradual emancipation laws in the northern states","Constitutional protections for slavery and the survival of coverture"],"a":3,"e":"The three-fifths, fugitive slave and slave-trade clauses wrote protection for slavery into the national framework, while married women's legal subordination continued. The other three options support the opposite argument, which is what makes them useful counterevidence in an essay."},{"q":"Shays's Rebellion is most often used as evidence for which causal claim?","o":["The Articles gave Congress excessive military power","Backcountry farmers dominated the Constitutional Convention","State governments were unwilling to collect taxes","Popular unrest strengthened support for a stronger national government"],"a":3,"e":"Massachusetts was collecting taxes aggressively — that was the grievance. The lesson elites drew was that no national force existed to answer domestic insurrection, and that argument carried into Philadelphia."},{"q":"Republican motherhood is best understood as","o":["An ideology assigning women civic significance through the raising of virtuous citizens, expanding education without granting political rights","A legal doctrine giving mothers custody rights after divorce","A movement for women's suffrage in the 1790s","A campaign to admit women to the Continental Army"],"a":0,"e":"A useful example of change and continuity inside a single development: real gains in female literacy and schooling, alongside continued exclusion from formal politics."},{"q":"The Northwest Ordinance's slavery provision is historically significant because it","o":["Was repealed by the Constitution in 1789","Set a precedent for excluding slavery from federal territory and helped make the Ohio River a sectional boundary","Applied to all land west of the Appalachians","Freed all enslaved people living in the territory in 1787"],"a":1,"e":"The ban applied prospectively and was unevenly enforced, with some enslaved people held in the territory for years afterward. Its precedent shaped every later territorial fight, from the Missouri Compromise to the Wilmot Proviso."},{"q":"The most enduring legacy of the Anti-Federalists was","o":["The three-fifths clause","The retention of the Articles of Confederation","The addition of the Bill of Rights","The creation of the Electoral College"],"a":2,"e":"They lost the ratification fight but forced the concession that produced the first ten amendments. Their warnings about consolidated national power also supplied lasting language for states'-rights arguments."},{"q":"Which comparison between the Articles and the Constitution is accurate?","o":["The Articles gave Congress no power over interstate commerce; the Constitution granted it explicitly","Both provided for a single national executive","The Articles created a national judiciary; the Constitution did not","Both required unanimous consent to amend"],"a":0,"e":"The commerce clause addressed one of the sharpest failures of the 1780s, when states levied duties on one another's goods. The Articles had neither an executive nor a judiciary."},{"q":"Which piece of evidence best supports the claim that the American Revolution had global consequences?","o":["Latin American independence movements of the 1810s and 1820s invoking natural-rights arguments","The founding of the African Methodist Episcopal Church","The Louisiana Purchase of 1803","The Whiskey Rebellion of 1794"],"a":0,"e":"Bolívar and others drew on the same natural-rights vocabulary, and the Haitian Revolution is an even more direct case. The Whiskey Rebellion and the AME church are domestic developments."},{"q":"Which chain of causation is best supported by the events of 1763 to 1775?","o":["Religious conflict between Anglicans and dissenters produced the Coercive Acts","War debt led Britain to tax the colonies, colonial resistance rested on representation and consent, and escalating coercion turned a tax dispute into a constitutional crisis","Native resistance persuaded Parliament to repeal the Navigation Acts","Colonial demand for independence in 1763 forced Britain to impose taxes"],"a":1,"e":"The through-line from debt to taxation to constitutional argument to coercion is the standard essay spine for the imperial crisis. Nothing before 1774 shows meaningful colonial support for independence."},{"q":"Comparing the Proclamation of 1763 with the Northwest Ordinance of 1787 shows that","o":["Britain sought to restrain westward settlement while the new republic organized and promoted it","Neither addressed western land","Both barred settlement west of the Appalachians","Both guaranteed Native land title permanently"],"a":0,"e":"The contrast is a clean comparison prompt. Both governments were trying to manage frontier conflict cheaply, but the American answer was orderly expansion rather than a boundary line."},{"q":"Which best explains why the same revolutionary generation produced both the Declaration's claim that all men are created equal and constitutional protections for slavery?","o":["The Declaration was not widely read","The Constitution's framers were unaware of the Declaration","Slavery was already illegal in most states by 1787","Union among thirteen states required accommodating slaveholding interests, so delegates subordinated the egalitarian principle to political necessity"],"a":3,"e":"Contemporaries saw the tension clearly — the excised passage in Jefferson's draft and the freedom petitions of the 1770s both show it. Framing it as a conscious political trade-off is stronger than calling it hypocrisy."},{"q":"Place these in correct order: Albany Plan, Stamp Act, Declaration of Independence, Treaty of Paris ending the war, Constitution ratified.","o":["1754, 1765, 1783, 1776, 1788","1754, 1765, 1776, 1783, 1788","1754, 1776, 1765, 1783, 1788","1765, 1754, 1776, 1788, 1783"],"a":1,"e":"Anchoring the period with these five dates makes most chronology questions manageable. Note that the 1763 Treaty of Paris ends the Seven Years' War and the 1783 treaty ends the Revolution — the exam does test that distinction."},{"q":"Which development best illustrates continuity between the imperial crisis and the politics of the 1790s?","o":["Consistent support for a strong executive across both periods","Unbroken alliance with France","Agreement that Parliament could tax the colonies","Suspicion of concentrated power and standing armies, which shaped resistance to Britain and then Jeffersonian opposition to Hamilton's program"],"a":3,"e":"Republican fear of corruption and consolidated power is the strongest continuity thread through the period, running from writs of assistance through the Whiskey Rebellion to the Virginia and Kentucky Resolutions."}]}]},{"label":"Period 4","years":"1800–1848","art":"p4","title":"Period Four","blurb":"Jefferson and the Marshall Court, the War of 1812, the market revolution, Jacksonian democracy, reform, and the cotton kingdom.","sets":[{"n":"Jefferson and the Marshall Court","d":"Topic 4.2 · the republican experiment, the judiciary, and Louisiana","Q":[{"q":"The disputed election of 1800 led directly to which constitutional change?","o":["The Twelfth Amendment, separating the electoral ballots for president and vice president","A statute giving the Senate authority to break future electoral ties","A convention called to revise the method of choosing presidential electors","The Eleventh Amendment, barring federal suits brought against a state by citizens"],"a":0,"e":"Jefferson and Burr tied at 73 electoral votes because electors could not distinguish the two offices. The House took 36 ballots to resolve it, and the amendment was ratified in 1804."},{"q":"Marbury v. Madison (1803) established the principle of","o":["Federal supremacy over state taxation of national banking institutions","Judicial review, the Court's authority to void laws it finds unconstitutional","Presidential control over the appointment and removal of federal judges","Broad congressional authority to regulate commerce among the several states"],"a":1,"e":"Marshall declined the power to order the commission delivered while claiming a far larger power for the Court. Judicial review appears nowhere in Article III — it is an assertion that stuck."},{"q":"Jefferson's constitutional hesitation over the Louisiana Purchase arose because","o":["Federalists controlled the House and would block any appropriation of funds","The Senate had already rejected two earlier treaties negotiated with France","Spain retained legal title and refused to acknowledge the French sale","The Constitution nowhere grants a president power to acquire foreign territory"],"a":3,"e":"He considered seeking an amendment, then accepted the treaty power as sufficient. It is the standard example of a strict constructionist acting broadly when the opportunity proved too good to refuse."},{"q":"The Lewis and Clark expedition (1804 to 1806) was significant primarily because","o":["It negotiated purchase of the Oregon country from British fur companies","It mapped the territory, catalogued species, and opened contact with interior nations","It founded permanent American settlements along the Columbia and the coast","It located the water passage long sought between the Missouri and the Pacific"],"a":1,"e":"The hoped-for Northwest Passage did not exist. Sacagawea's presence and linguistic help were crucial to the Corps of Discovery's relations with the nations it encountered."},{"q":"The Embargo Act of 1807 was intended to","o":["Shield infant American manufacturing behind a steep protective tariff","Raise the revenue needed to retire the debt Hamilton had funded","Pressure Britain and France economically while avoiding an armed conflict","Punish New England shippers for their continued support of the Federalists"],"a":2,"e":"It devastated American shipping, especially in New England, and produced widespread smuggling. Jefferson signed its repeal days before leaving office in 1809."},{"q":"In McCulloch v. Maryland (1819), the Marshall Court held that","o":["The national bank exceeded every power the Constitution grants Congress","A state may tax federal property that lies within its own borders","Congress holds implied powers, and a state may not tax a federal instrument","Only powers expressly enumerated in Article I are constitutionally valid"],"a":2,"e":"The decision settled the Hamilton and Jefferson bank dispute in Hamilton's favor. Marshall's reasoning on implied powers became the foundation for expansive readings of federal authority."},{"q":"Gibbons v. Ogden (1824) strengthened federal authority by","o":["Giving the president exclusive power over treaties affecting foreign trade","Granting states authority to license navigation within their own waters","Defining interstate commerce broadly and placing it under congressional control","Voiding every state law that chartered a private business corporation"],"a":2,"e":"The case broke a New York steamboat monopoly. A broad commerce clause proved one of the most consequential tools of national power in later American law."},{"q":"Dartmouth College v. Woodward (1819) and Fletcher v. Peck (1810) both protected","o":["The sanctity of contracts against interference by state legislatures","Freedom of the press against prosecution for seditious libel","The right of states to revoke corporate charters whenever they chose","Federal authority over the sale and transfer of Native land titles"],"a":0,"e":"Both rest on the contract clause of Article I, Section 10. The Marshall Court's steady protection of contract and property helped create a stable legal environment for commercial expansion."},{"q":"Which statement about Jefferson's presidency in practice is accurate?","o":["He abolished the circuit courts and impeached the entire Supreme Court","He dismantled every Federalist institution he had campaigned against","He cut the army, navy and debt but left the national bank standing","He raised tariffs to the highest levels the country had yet seen"],"a":2,"e":"His inaugural line about all being Republicans and Federalists signaled continuity as much as change. The gap between Republican theory and governing practice is a recurring essay theme."},{"q":"American conflict with the Barbary states early in the century concerned","o":["French privateering against American commerce in the West Indies","Spanish restrictions on American use of the port at New Orleans","Tribute payments and attacks on American shipping in the Mediterranean","British impressment of American sailors aboard merchant vessels at sea"],"a":2,"e":"Jefferson refused continued tribute and sent the navy he had otherwise been shrinking. Impressment was a British practice and an entirely separate grievance."}]},{"n":"America on the world stage","d":"Topics 4.3 and 4.4 · the War of 1812, nationalism, and sectional strain","Q":[{"q":"The most important causes of the War of 1812 included","o":["A French invasion of the Gulf Coast following the Louisiana sale","British refusal to acknowledge the independence granted back in 1783","Impressment, interference with neutral trade, and War Hawk ambitions westward","American designs on Cuba and the remaining Spanish Caribbean colonies"],"a":2,"e":"War Hawks like Clay and Calhoun also blamed Britain for supporting Native resistance in the Northwest. New England, whose shipping suffered most, largely opposed the war."},{"q":"Tecumseh and Tenskwatawa are best known for","o":["Building a pan-Indian confederacy paired with a revival rejecting American goods","Negotiating the Treaty of Greenville after the defeat at Fallen Timbers","Leading Cherokee resistance to removal through the Georgia state courts","Allying with Spanish Florida against American settlers in the Southeast"],"a":0,"e":"Harrison's attack at Tippecanoe in 1811 damaged the movement, and Tecumseh's death at the Thames in 1813 ended it. Native resistance east of the Mississippi never recovered that scale."},{"q":"The Hartford Convention of 1814 and 1815 mattered because","o":["It aired Federalist grievances as news of victory arrived, discrediting the party","It authorized New England's formal withdrawal from the Union in 1815","It endorsed the war effort and voted fresh appropriations for the navy","It secured three constitutional amendments limiting the influence of the South"],"a":0,"e":"News of Ghent and New Orleans arrived as the delegates presented their case, making them look disloyal. The Federalist Party never mounted another national campaign."},{"q":"The Treaty of Ghent (1814) ended the war by","o":["Granting American fishermen permanent access to Newfoundland waters","Ending impressment through an explicit British renunciation of the practice","Restoring prewar boundaries and settling almost none of the original disputes","Transferring Upper Canada to the United States as wartime compensation"],"a":2,"e":"Impressment went unmentioned, though the end of the Napoleonic wars made it moot. Jackson's victory at New Orleans came after the treaty was signed but before news of it crossed the Atlantic."},{"q":"Henry Clay's American System consisted of","o":["A protective tariff, a national bank, and federally funded internal improvements","A national university, a standing army, and overseas coaling stations","Nullification, low tariffs, and strict limits on all federal spending","Free trade, hard currency, and rapid removal of eastern Native nations"],"a":0,"e":"The aim was an integrated national economy binding West, South and Northeast. Constitutional objections to federally funded roads and canals limited the internal improvements piece."},{"q":"The Era of Good Feelings is a misleading label because","o":["Beneath one-party rule lay the Panic of 1819 and the Missouri crisis","The period was consumed by continuous warfare along the western frontier","Monroe was deeply unpopular and lost his bid for a second term","Two evenly matched parties competed bitterly throughout the whole decade"],"a":0,"e":"The Federalists' collapse produced the appearance of consensus. Expect essay prompts asking you to challenge the label using exactly those developments."},{"q":"The Missouri Compromise of 1820 provided that","o":["Missouri would be divided into a free half and a slaveholding half","Missouri entered slave, Maine free, and slavery was barred north of 36°30'","Slavery would be prohibited in every state admitted to the Union after 1820","Each territory would settle the question by a vote of its own settlers"],"a":1,"e":"The deal preserved the Senate's free and slave balance. Jefferson's description of it as a fire bell in the night captures how clearly contemporaries saw the danger."},{"q":"The Adams–Onís Treaty of 1819 secured","o":["Spanish cession of Florida and a boundary line drawn through to the Pacific","American purchase of Texas and the northern provinces of Mexico","A joint occupation agreement covering both Cuba and Puerto Rico","Spanish recognition of the newly independent Latin American republics"],"a":0,"e":"Jackson's unauthorized raids into Florida strengthened Adams's negotiating hand. The transcontinental line was the treaty's more lasting achievement."},{"q":"The Monroe Doctrine (1823) declared that","o":["European powers must abandon their existing American colonies within a decade","The hemisphere was closed to new colonization and America would avoid European affairs","The United States would annex any Spanish colony that declared its independence","The United States would join Britain in a formal defensive alliance"],"a":1,"e":"Written largely by John Quincy Adams, who rejected a joint declaration with Britain. In practice the British navy, not American power, enforced it for decades."},{"q":"The postwar surge of nationalism produced which measures in 1816?","o":["The Missouri Compromise and the tariff later called the Abominations","The Second Bank of the United States and the first protective tariff","The Embargo Act and the Non-Intercourse Act directed against Britain","The Indian Removal Act and the Force Bill aimed at South Carolina"],"a":1,"e":"Wartime financial chaos converted many Republicans, Calhoun among them, into supporters of a national bank. Calhoun's later reversal on the tariff shows how sectional interest reshaped ideology."}]},{"n":"The market revolution","d":"Topic 4.5 · transportation, industry, and the reorganization of work","Q":[{"q":"The Erie Canal, completed in 1825, mattered most because","o":["It rendered steamboat traffic on the Hudson commercially obsolete","It linked the Mississippi to the Gulf and opened the western trade","It was the first internal improvement financed by the federal government","It cut inland shipping costs and made New York the nation's leading port"],"a":3,"e":"New York State financed it, since federal funding for internal improvements was constitutionally contested. Its success set off a canal boom several states could not afford."},{"q":"The Lowell system was distinctive because","o":["It employed enslaved laborers leased from plantations in the Upper South","It recruited unmarried farm women into mills with supervised boardinghouses","It distributed spinning to rural households under the putting-out system","It depended on skilled male artisans organized into traditional craft guilds"],"a":1,"e":"Wages gave many women a first experience of independent earnings, alongside strict supervision. As competition tightened in the 1830s, speedups provoked some of the earliest factory strikes."},{"q":"Interchangeable parts, promoted by Eli Whitney, transformed manufacturing because","o":["Demand for precision machine tools fell sharply across the Northeast","Unskilled workers could assemble standardized components, enabling mass production","Factories became unnecessary since parts could be finished at home","Skilled craftsmen could command far higher wages for custom handwork"],"a":1,"e":"Whitney oversold his own results on a government arms contract, but the principle became the basis of what Europeans later called the American system of manufactures."},{"q":"Samuel Morse's telegraph, demonstrated in 1844, was significant because","o":["It separated communication from physical transportation for the first time","It allowed transatlantic voice communication between merchants and agents","It remained a military technology closed to ordinary commercial users","It replaced the postal system as the chief carrier of business mail"],"a":0,"e":"News, orders and prices could now outrun any traveler. Combined with the railroad, it knit together a genuinely national market in goods and information."},{"q":"The cotton gin's most important consequence was that","o":["It ended the internal slave trade by mechanizing most of the harvest","It made short-staple cotton profitable and drove slavery's expansion inland","It shifted cotton cultivation toward the free states of the Northwest","It cut the labor required and so lowered demand for enslaved people"],"a":1,"e":"Cleaning was the bottleneck; removing it made inland cultivation viable. Southern cotton also supplied northern and British mills, tying both economies to slavery."},{"q":"The Panic of 1819 was caused largely by","o":["The collapse of several state-financed canal projects in the West","A failed cotton harvest across the Deep South and the Gulf states","A British naval blockade of American ports along the Atlantic coast","Land speculation, loose lending, and a sudden credit contraction by the Bank"],"a":3,"e":"It was the first major peacetime depression of the market economy. Western farmers and debtors blamed the Bank, which shaped Jacksonian hostility to it a decade later."},{"q":"The market revolution changed the nature of work primarily by","o":["Replacing enslaved labor with paid workers throughout the cotton South","Slowing urban growth as workers returned to self-sufficient family farming","Moving households from producing for use toward wage work for distant markets","Eliminating agriculture as an occupation across most of the rural Northeast"],"a":2,"e":"Time discipline, wage dependence and specialization all followed. The transformation was uneven, and rural households kept producing for themselves well past mid-century."},{"q":"Irish and German immigration in the 1840s differed in that","o":["Irish immigrants settled mainly on western farms purchased with savings","Irish arrivals were poorer and urban, while Germans more often farmed the Midwest","Germans arrived chiefly as indentured servants bound to eastern employers","Germans were overwhelmingly Catholic while the Irish were largely Protestant"],"a":1,"e":"Both groups met nativist hostility, sharpened by anti-Catholic feeling. That reaction produced the political movement that became the Know-Nothings."},{"q":"Railroads surpassed canals by the 1850s because","o":["They cost substantially less to build than an equivalent mileage of canal","They were financed privately and required no assistance from government","They escaped the credit collapse that followed the Panic of 1837","They ran year-round on routes unconstrained by rivers and by terrain"],"a":3,"e":"Canals froze in winter and followed the water. Railroad corporations also pioneered the large-scale management structures that later industries copied."},{"q":"Early labor organizing in the 1830s and 1840s achieved which notable legal gain?","o":["Commonwealth v. Hunt (1842), holding that unions were not criminal conspiracies","A federal statute establishing the eight-hour day for industrial workers","Federal legislation requiring employers to bargain with elected unions","A Supreme Court ruling abolishing child labor in the textile mills"],"a":0,"e":"Enforcement stayed weak and the Panic of 1837 crushed most early unions. The ten-hour movement won limited gains, mainly for federal employees."}]},{"n":"Culture and society in a market age","d":"Topics 4.6 and 4.9 · class, gender, and an American culture","Q":[{"q":"The cult of domesticity held that","o":["Household manufacture should replace the harsh discipline of factory labor","Women's sphere was the home, where they exercised moral influence over the family","Married women should hold and control property in their own names","Women should enter the professions on the same terms as men did"],"a":1,"e":"It described the aspirations of a growing urban middle class, not the reality for farm women, enslaved women or mill workers. Reformers later used its logic to justify public activism."},{"q":"Transcendentalism, associated with Emerson and Thoreau, emphasized","o":["Individual intuition and communion with nature over inherited institutions","Commercial success as the surest available measure of personal worth","A disciplined return to the Calvinist orthodoxy of the New England Puritans","Scientific materialism and the rejection of all spiritual explanation"],"a":0,"e":"Thoreau's essay on civil disobedience, prompted by the Mexican War and slavery, gave the movement a political edge. It also fed experiments in communal living like Brook Farm."},{"q":"The Hudson River School is best understood as","o":["A circle of political economists writing in defense of the protective tariff","A literary society organized around Washington Irving in New York City","An architectural movement reviving Greek forms in American public buildings","Landscape painters who made the American wilderness a source of national identity"],"a":3,"e":"Thomas Cole and Frederic Church made the continent itself the subject worth painting. Note the tension: the scenery was celebrated precisely as settlement transformed it."},{"q":"Washington Irving and James Fenimore Cooper contributed to cultural nationalism by","o":["Organizing the landscape painters who became the Hudson River School","Setting fiction in American landscapes rather than imitating European models","Founding the first daily newspapers in Boston and in Philadelphia","Translating the European classics for a rapidly growing American readership"],"a":1,"e":"Critics abroad had asked pointedly who read an American book. The Leatherstocking novels and Irving's Hudson valley tales were part of the answer."},{"q":"Nativism in the 1830s and 1840s was directed primarily at","o":["Chinese laborers recruited for railroad construction work in California","Free Black migrants arriving in northern cities from the Upper South","Catholic immigrants, especially the Irish, on religious and economic grounds","German-speaking Protestants settling in Pennsylvania and the Midwest"],"a":2,"e":"It produced anti-Catholic riots and the burning of a convent near Boston in 1834. Chinese immigration and the hostility to it belong to the 1850s and later."},{"q":"Urban growth in the period produced","o":["The sudden disappearance of skilled artisans from every urban trade","Broadly shared prosperity across all ranks of the city population","Sharper segregation by class, with crowding, disease and poor sanitation","A marked decline in immigration to the largest of the eastern cities"],"a":2,"e":"Cholera epidemics in 1832 and 1849 hit poor districts hardest. The emerging middle class increasingly lived apart from both the wealthy and the laboring poor."},{"q":"The penny press, beginning in the 1830s, mattered because","o":["It displaced the political parties as the organizers of election campaigns","It circulated chiefly among wealthy merchants and the urban professions","It made daily papers cheap enough to reach a genuine mass readership","It was published and directly subsidized by the federal government"],"a":2,"e":"Advertising revenue rather than subscriptions made it viable. Cheap print also carried reform literature, including abolitionist material, to a far wider audience."},{"q":"Family patterns among the northern middle class shifted toward","o":["Marriages arranged by parents for economic and social advantage","Smaller families, later marriage, and greater emphasis on raising children","Larger households with more children contributing directly to family income","Multigenerational households becoming the standard form in northern cities"],"a":1,"e":"Children came to be seen as requiring nurture rather than as economic contributors. Birth rates fell substantially over the first half of the century."},{"q":"Which statement about free public education in this period is accurate?","o":["Public schooling developed earliest and went furthest in the southern states","Congress established a federal system of public schools during the 1840s","Horace Mann led a movement expanding tax-supported common schools","Schools were funded entirely by churches and by private tuition payments"],"a":2,"e":"Mann argued common schools would produce disciplined, literate citizens and reduce class conflict. The South lagged, and teaching became an occupation open to women."},{"q":"The Second Great Awakening's broader cultural effect was to","o":["Discourage participation by women and by free Black worshippers","Spread belief in individual moral agency that fueled the reform movements","Reduce church membership sharply across the northern and western states","Restore the authority of settled clergy over their own congregations"],"a":1,"e":"If salvation was open to anyone who chose it, so was the perfection of society. That logic runs from revival meetings into temperance, abolition and women's rights."}]},{"n":"Expanding democracy and Jackson","d":"Topics 4.7 and 4.8 · suffrage, party, nullification, and federal power","Q":[{"q":"The expansion of the suffrage in the 1820s and 1830s consisted mainly of","o":["The voting age falling to eighteen across most of the northern states","States dropping property tests for white men while restricting Black voters","Several states extending the franchise to women who owned property","Congress legislating a national standard of universal adult male suffrage"],"a":1,"e":"Democratization and racial exclusion advanced together — Pennsylvania disenfranchised Black voters in 1838. Holding both halves of that sentence at once is what strong essays do here."},{"q":"The election of 1824 became known for the corrupt bargain because","o":["The Senate set aside the popular vote and installed Adams directly","Jackson led the voting, the House chose Adams, and Clay entered his cabinet","Jackson withdrew before the House balloting and endorsed William Crawford","Electoral returns were falsified in three states that Jackson had carried"],"a":1,"e":"No candidate had an electoral majority, so the Twelfth Amendment sent it to the House, where Clay's support proved decisive. Jackson spent four years campaigning on the grievance."},{"q":"The second party system pitted Democrats against Whigs, who generally favored","o":["Strict construction, hard money, and aggressive expansion into the territories","Clay's American System, active promotion of development, and moral reform","Abolition of the tariff, the national bank, and the federal judiciary","Nullification, free trade, and the primacy of state sovereignty"],"a":1,"e":"Whigs drew strength from commercial areas and evangelical reformers; Democrats from small farmers, urban workers and recent immigrants. Both were national coalitions spanning free and slave states."},{"q":"Jackson defended the spoils system on the grounds that","o":["Only college-trained men possessed the competence federal office demanded","State legislatures judged local appointments better than a distant president","Lifetime tenure protected civil servants from partisan political interference","Rotation prevented an entrenched officeholding class and any citizen could serve"],"a":3,"e":"The practical effect was to reward party loyalty and strengthen party machinery. It is a good case study of a democratic principle and a partisan instrument being the same thing."},{"q":"The nullification crisis arose when","o":["South Carolina refused to carry out the removal of the Cherokee Nation","Georgia attempted to leave the Union over the Missouri settlement","South Carolina declared the tariffs void, prompting Jackson's Force Bill","Virginia blocked the recharter of the Second Bank in the Senate"],"a":2,"e":"Calhoun's compact theory descends from the Virginia and Kentucky Resolutions. Jackson denied nullification absolutely while Clay's compromise tariff of 1833 gave both sides an exit."},{"q":"Jackson's veto of the Bank recharter in 1832 rested on the argument that","o":["The Bank had grown too small to serve a rapidly expanding economy","Only the states, and not Congress, could lawfully charter a corporation","The Bank had failed to prevent the sharp financial depression of 1819","The Bank was an unconstitutional monopoly serving the wealthy and foreigners"],"a":3,"e":"Jackson also asserted the president's own authority to judge constitutionality, independent of the Court. Removing deposits to pet banks and the later Specie Circular helped bring on the Panic of 1837."},{"q":"In Worcester v. Georgia (1832), the Supreme Court held that","o":["The Cherokee Nation was a distinct community that Georgia law could not reach","Georgia could extinguish Cherokee land titles whenever its legislature chose","Native nations counted as foreign states for purposes of federal jurisdiction","Removal treaties required ratification by two-thirds of the federal Senate"],"a":0,"e":"Marshall ruled for the Cherokee and the ruling went unenforced. The missionary physician Elizur Butler counted over 4,000 dead of roughly 15,000 removed — nearly a fifth. The famous Jackson line about Marshall enforcing his own decision is apocryphal, first printed in 1864."},{"q":"Jackson's use of the veto was notable because","o":["He declined to veto any measure passed by a Democratic majority","He was overridden by Congress on nearly every veto that he issued","He reserved it exclusively for legislation touching tariffs and revenue","He used it more than all prior presidents combined, often on policy grounds"],"a":3,"e":"That expansion of executive power drove opponents to call themselves Whigs, after the British party opposed to royal authority, and to caricature him as King Andrew."},{"q":"The rise of national nominating conventions in the early 1830s reflected","o":["A return to the selection of candidates by the state legislatures","Federal legislation regulating how the parties selected their nominees","A sharp decline in popular participation in presidential election campaigns","A more participatory way of choosing candidates than the congressional caucus"],"a":3,"e":"The Anti-Masonic Party held the first one in 1831. Turnout reached 80.3 percent of eligible voters in 1840 — but only 31.9 percent of the voting-age population, a gap that measures how many people were excluded."},{"q":"The Panic of 1837 is generally attributed to","o":["Speculative lending, the Specie Circular, and a contraction of British credit","Excessive federal spending on roads, canals and harbor improvements","The Force Bill's disruption of customs collection in the port of Charleston","A collapse in world cotton production following a season of crop disease"],"a":0,"e":"The depression lasted into the early 1840s and fell on Van Buren's presidency. His independent treasury, separating government funds from private banks, satisfied neither party."}]},{"n":"Religion and reform","d":"Topics 4.10 and 4.11 · revival, perfectionism, and an age of reform","Q":[{"q":"Charles Grandison Finney's revivalism was distinctive for teaching that","o":["Religious enthusiasm endangered social order and ought to be restrained","Salvation came through sacraments administered by properly ordained clergy","Salvation was open to anyone who chose it, making individuals responsible","Predestination fixed the fate of every soul before the world began"],"a":2,"e":"This break from Calvinist predestination is the theological engine of the reform era. Western New York saw so many revivals it was called the burned-over district."},{"q":"William Lloyd Garrison's position, announced in The Liberator in 1831, was","o":["Gradual emancipation carried out over the following three or four decades","Immediate emancipation without compensation, rejecting gradualism and colonization","A prohibition limited to the interstate trade in enslaved people","Resettlement of freed people in the new American colony at Liberia"],"a":1,"e":"Garrison also rejected political action and once burned a copy of the Constitution as a proslavery document. That split the movement from political abolitionists, who formed the Liberty Party in 1840."},{"q":"David Walker's Appeal (1829) was significant because","o":["It called on enslaved people to resist, alarming southern state legislatures","It was written by a white minister from upstate New York","It endorsed the American Colonization Society's resettlement program","It proposed gradual emancipation with compensation paid to slaveholders"],"a":0,"e":"Walker was a free Black Bostonian. Southern states banned the pamphlet and tightened restrictions on Black literacy and movement in response."},{"q":"The Seneca Falls Convention of 1848 produced","o":["A national women's party organized to contest the 1848 election","Married women's property statutes adopted across the northern states","The Declaration of Sentiments, modeled on the Declaration of Independence","The first women's suffrage amendment formally introduced in Congress"],"a":2,"e":"Stanton and Mott had met at a London antislavery convention where women were seated apart from the men. The suffrage demand was the most contested resolution, carried after Douglass spoke for it."},{"q":"Dorothea Dix is associated with reform of","o":["The condition of public schools across rural New England school districts","The imprisonment of debtors under state and municipal statutes","The treatment of the mentally ill, often confined in jails and almshouses","The enforcement of temperance legislation in the northern port cities"],"a":2,"e":"Her reports to state legislatures led to the founding of dozens of asylums. The effort reflects a broader belief that carefully designed institutions could reform human beings."},{"q":"Utopian communities such as New Harmony, Oneida and Brook Farm shared","o":["Support for extending slavery into the newly organized western territories","A commitment to industrial capitalism as the surest engine of progress","A conviction that reorganizing property or family life could perfect society","A thoroughgoing rejection of religious belief in each of its forms"],"a":2,"e":"Their arrangements varied enormously, from Owen's secular socialism to Oneida's complex marriage. Nearly all were short-lived, but they mark how far perfectionist logic could be pushed."},{"q":"The temperance movement gained strength because reformers linked alcohol to","o":["Failures of American diplomacy in the Caribbean and in Latin America","The steady expansion of slavery into the new southwestern states","Poverty, domestic violence, and disorder in an increasingly industrial workplace","Declining agricultural yields across the grain-growing states of the Northwest"],"a":2,"e":"It was the largest reform movement of the era by membership. Maine passed the first statewide prohibition law in 1851, and the cause carried a strong anti-immigrant edge."},{"q":"The American Colonization Society proposed","o":["Buying enslaved people for resettlement in the western federal territories","Immediate emancipation with no compensation paid to former slaveholders","Integrating free Black Americans fully into northern economic and civic life","Resettling free Black Americans in Africa, which most of them rejected"],"a":3,"e":"It founded Liberia in 1822 and drew support from slaveholders who wanted free Black people removed. Opposition from northern Black conventions evidences an assertive free Black politics."},{"q":"The Mormon movement founded by Joseph Smith","o":["Remained a small movement confined to rural New England and Vermont","Rejected communal ownership in favor of strictly individual enterprise","Faced repeated persecution that drove it west to the Great Salt Lake","Was welcomed by state authorities everywhere it established new settlements"],"a":2,"e":"Smith was killed by a mob in Illinois in 1844. The migration to Utah in 1847 makes it both a religious movement and a major episode of westward settlement."},{"q":"Frederick Douglass's significance in the movement rested on","o":["His service as a founding agent of the Liberty Party in 1840","His long advocacy of colonization as the only workable eventual solution","His leadership of an armed uprising in the Virginia tidewater counties","His testimony as a formerly enslaved man and his break with Garrison"],"a":3,"e":"His Narrative of 1845 was a bestseller and a rebuttal to proslavery claims about Black capacity. He came to argue the Constitution could be read as an antislavery document."}]},{"n":"Slavery and southern society","d":"Topics 4.12 and 4.13 · the cotton kingdom, resistance, and the proslavery argument","Q":[{"q":"After Congress banned the international slave trade in 1808, southern slavery expanded through","o":["Continued legal importation from the sugar islands of the Caribbean","An internal trade moving roughly a million people to the Deep South","Voluntary migration of free Black laborers seeking plantation wages","A federal program purchasing and resettling enslaved people westward"],"a":1,"e":"Historians call it the second middle passage: roughly a million people moved from the Upper to the Lower South between 1787 and 1861, about two-thirds of them through the trade itself. It broke apart an enormous number of families."},{"q":"Nat Turner's rebellion in 1831 led most directly to","o":["Harsher codes restricting Black literacy, assembly and independent preaching","A gradual emancipation statute adopted by Virginia the following year","A federal commission sent to investigate conditions on southern plantations","The closing of the interstate trade in enslaved men and women"],"a":0,"e":"Virginia's legislature debated gradual emancipation in 1832 and rejected it, then turned toward repression. After 1831 open criticism of slavery inside the South became nearly impossible."},{"q":"Enslaved people most commonly resisted through","o":["Lawsuits for freedom filed regularly in the southern state courts","Frequent large armed rebellions coordinated across several neighboring counties","Organized strikes timed to the planting and the harvest seasons","Slowdowns, feigned illness, sabotage, and running off for short periods"],"a":3,"e":"Open revolt was rare because it was nearly suicidal. Sustaining family ties, religious practice and cultural forms under those conditions was itself a form of resistance."},{"q":"Denmark Vesey's 1822 conspiracy in Charleston is notable because","o":["A free Black carpenter organized it, and betrayal brought severe reprisals","It freed several hundred people before the militia restored order","The South Carolina legislature quietly sympathized with its stated aims","It unfolded in the Virginia tidewater a decade before Turner's revolt"],"a":0,"e":"Authorities executed Vesey and dozens of others. The city tightened surveillance of free Black residents and closed the African church where he had worshipped."},{"q":"Which statement about white southern society is accurate?","o":["Most white families owned no enslaved people, though planters held power","Planters exercised comparatively little influence over state politics or policy","Most white southerners operated plantations with twenty or more laborers","Slaveholding was distributed fairly evenly among white southern households"],"a":0,"e":"The share ranged from about 3 percent of families in Delaware to nearly half in Mississippi in 1860, and large planters were a small fraction of any of those. Explaining why non-slaveholding whites supported the system is a frequent essay task."},{"q":"The shift in the proslavery argument by the 1830s was","o":["From necessary evil toward positive good, argued from scripture and paternalism","Toward the claim that slave labor had become economically unprofitable","Toward colonization as the eventual and altogether inevitable solution","From open defense toward quiet acceptance of an eventual emancipation"],"a":0,"e":"Calhoun's positive-good speech of 1837 is the standard citation. The hardening followed Nat Turner, Garrison's immediatism, and a cotton boom that made slavery more valuable."},{"q":"The gag rule adopted by the House in 1836","o":["Required the southern states to admit federal labor inspectors","Tabled antislavery petitions automatically, and Adams fought it until 1844","Barred abolitionist newspapers from circulating through the federal mails","Abolished the trade in enslaved people within the District of Columbia"],"a":1,"e":"It let abolitionists reframe their cause as a defense of free speech and petition for white northerners, which broadened their appeal well beyond opposition to slavery itself."},{"q":"Free Black communities in the South","o":["Did not exist in any southern state before the middle of the century","Held essentially the same legal standing as their white neighbors did","Were numerous in the Upper South and cities, under tightening restrictions","Voted freely throughout the region until the outbreak of the Civil War"],"a":2,"e":"Some built businesses, churches and schools, notably in Baltimore, Charleston and New Orleans. Several states eventually required newly freed people to leave or risk re-enslavement."},{"q":"The southern economy in this period was characterized by","o":["Diversified manufacturing that rivaled the industrial output of the Northeast","A steady turn inward, away from dependence on overseas export markets","Rapid growth of industrial cities along the Gulf and the Atlantic coasts","Heavy specialization in cotton exports, with little industry or urban growth"],"a":3,"e":"Cotton was the nation's leading export and enriched northern shippers, insurers and textile manufacturers too. Capital concentrated in land and enslaved people rather than in factories."},{"q":"Enslaved religious practice in the quarters often","o":["Was prohibited outright on nearly every plantation across the South","Rejected Christianity in favor of retained African practice alone","Mirrored white worship closely under constant supervision by clergy","Blended Christian belief with African traditions and stressed deliverance"],"a":3,"e":"The hush harbor tradition and the spirituals are the usual evidence. Exodus narratives carried a meaning masters did not intend, which is why they policed Black preaching after 1831."}]},{"n":"Cumulative review","d":"Topics 4.1 to 4.14 · causation, comparison, and chronology across 1800 to 1848","Q":[{"s":"President James Monroe, annual message to Congress, December 1823","t":"…the American continents, by the free and independent condition which they have assumed and maintain, are henceforth not to be considered as subjects for future colonization by any European powers… We owe it, therefore, to candor… to declare that we should consider any attempt on their part to extend their system to any portion of this hemisphere as dangerous to our peace and safety.","q":"This declaration is best understood as","o":["A formal alliance binding the new Latin American republics to Washington","A declaration of war intended to expel Spain from the American mainland","An assertion of hemispheric primacy the United States could not itself enforce","A pledge to support liberal revolutions within the European monarchies"],"a":2,"e":"Britain wanted a joint statement; John Quincy Adams insisted on a unilateral one. For decades the Royal Navy, not the United States, actually deterred European recolonization."},{"c":1,"q":"The doctrine's second half committed the United States to","o":["Suspending commercial relations with Britain until its colonies withdrew","Staying clear of the internal political affairs of the European powers","Annexing Cuba and Puerto Rico once Spanish authority finally collapsed","Joining the Concert of Europe as a guarantor of the general peace"],"a":1,"e":"The reciprocal structure — hands off our hemisphere, hands off yours — descends directly from Washington's Farewell Address and stayed rhetorically central for a century."},{"s":"Declaration of Sentiments, Seneca Falls Convention, July 1848","t":"We hold these truths to be self-evident: that all men and women are created equal; that they are endowed by their Creator with certain inalienable rights… The history of mankind is a history of repeated injuries and usurpations on the part of man toward woman, having in direct object the establishment of an absolute tyranny over her.","q":"The document's rhetorical strategy was to","o":["Argue from English common law precedent on the rights of widows","Draft a constitutional amendment for submission to the state legislatures","Rest the case entirely on scriptural authority and on Christian duty","Adapt the Declaration so that founding principles indicted women's subordination"],"a":3,"e":"Turning the founders' language against existing arrangements is the same move enslaved petitioners made in the 1770s and Black abolitionists made in the 1820s. That continuity is worth citing."},{"c":1,"q":"The resolution at Seneca Falls that provoked the most disagreement demanded","o":["That women be admitted equally to colleges and to professional schools","That the convention endorse statewide prohibition of the liquor trade","That married women control their own wages and their own property","That women be granted the right to vote in state and federal elections"],"a":3,"e":"Even sympathetic delegates thought suffrage too radical to be credible. It was the most contested resolution of the convention and carried only after Frederick Douglass rose to argue for it."},{"q":"Which chain of causation is best supported by developments between 1800 and 1848?","o":["Territorial expansion produced revivalism, which in turn drove industrialization","Immigration caused the War of 1812, which then produced the American System","Jacksonian politics produced the cotton gin and then sectional conflict","Transport widened markets, encouraging specialization, wage labor and reform politics"],"a":3,"e":"The market revolution is the organizing cause for most of Period 4. Tying social and cultural change back to transportation and market integration is a reliable essay structure."},{"q":"Comparing northern and southern responses to the market revolution shows that","o":["Both regions industrialized at broadly similar rates in the decades before 1848","The North diversified into industry and cities; the South deepened plantation slavery","The South urbanized faster while the North remained a largely agricultural region","Neither region was much altered by the expansion of commercial markets"],"a":1,"e":"Both were commercializing and both were tied to cotton; the divergence lay in labor systems and where capital was invested. That divergence underlies the sectional crisis of Period 5."},{"q":"Place these in correct order: Louisiana Purchase, Missouri Compromise, Jackson's Bank veto, Nat Turner's rebellion, Seneca Falls Convention.","o":["1803, 1831, 1820, 1832, 1848","1820, 1803, 1831, 1832, 1848","1803, 1820, 1832, 1831, 1848","1803, 1820, 1831, 1832, 1848"],"a":3,"e":"Note the close pairing of Turner in August 1831 and the Bank veto in July 1832 — the same eighteen months produced a hardening of slavery's defense and the peak of the Bank War."},{"q":"Which development best illustrates continuity between Period 3 and Period 4?","o":["Universal white male suffrage, already established by the elections of 1789","Compact theory, running from the Kentucky Resolutions to Calhoun's nullification","Continuous two-party rivalry between the Federalists and the Whigs","Federal funding of internal improvements, accepted without dispute throughout"],"a":1,"e":"Calhoun's South Carolina Exposition builds directly on Madison and Jefferson's 1798 arguments — though Madison, still alive in 1832, denied that his resolutions justified nullification."},{"q":"A historian arguing that democracy expanded in this period would most likely cite","o":["Pennsylvania stripping free Black men of the vote in its 1838 constitution","Property tests falling, conventions replacing caucuses, and turnout above eighty percent","The House tabling antislavery petitions without debate after the 1836 session","The removal of the Cherokee from Georgia despite a Supreme Court ruling"],"a":1,"e":"The last three are the counterevidence, and the strongest essays use both. Democratization for white men proceeded alongside a contraction of rights for others."},{"q":"The reform movements of the 1830s and 1840s drew their common energy from","o":["Organizational models imported from European socialist and labor parties","The Awakening's belief that individuals could choose salvation and perfect society","Federal appropriations supporting schools, asylums and temperance societies","The official platform adopted by the Whig Party after its founding"],"a":1,"e":"That shared root explains why temperance, abolition, education and asylum reform so often drew the same people. It also explains reformers' characteristic optimism about human improvability."}],"SAQ":[{"h":"The market revolution and its consequences","q":["a) Briefly describe ONE specific technological or transportation development of the period from 1800 to 1848.","b) Briefly explain ONE way that development changed American society or the economy.","c) Briefly explain ONE way the market revolution affected the North and the South differently."],"m":"a) Acceptable: the Erie Canal (1825); the steamboat; railroads; the telegraph (1844); interchangeable parts; the cotton gin; the Lowell textile mills.\n\nb) Must follow from part a. Examples: canals and railroads cut freight costs and pulled western farmers into national and international markets; factory work replaced household production and created a wage-earning class; the telegraph separated communication from transportation, allowing national markets in prices and news; the cotton gin made short-staple cotton profitable and drove slavery's expansion.\n\nc) Acceptable: the North developed manufacturing, wage labor, cities and immigrant populations, while the South specialized in cotton and invested capital in land and enslaved people rather than industry; northern textile mills and southern plantations were economically interdependent even as their labor systems diverged; internal improvements and tariffs benefited northern and western interests while southern planters saw them as costs.\n\nScoring: each part earns 1 point. Part b earns credit only if it follows from the development named in part a."},{"h":"Democracy and its limits in the Jacksonian era","q":["a) Briefly describe ONE specific way political participation expanded between 1820 and 1840.","b) Briefly describe ONE specific group whose rights contracted during the same period.","c) Briefly explain ONE reason both developments could occur at the same time."],"m":"a) Acceptable: states dropped property qualifications for white male voters; national nominating conventions replaced the congressional caucus beginning in 1831; presidential turnout rose to roughly 80 percent of eligible voters by 1840; more offices became elective; the penny press expanded political information.\n\nb) Acceptable: free Black men lost the vote in several northern states, including Pennsylvania in 1838; Native nations were removed under the Indian Removal Act of 1830, with Worcester v. Georgia unenforced; women remained excluded from the franchise; enslaved people faced tightening codes after 1831.\n\nc) Acceptable: political equality was defined in racial terms, so a broader white male electorate coexisted with the exclusion of others; parties competing for white votes had incentives to appeal to racial solidarity; expanding white male citizenship was partly defined against those denied it; Jacksonian hostility to privilege targeted economic elites rather than racial hierarchy.\n\nScoring: part c must offer an actual explanation of the relationship, not simply restate that both happened."}]}]}];

const $=id=>document.getElementById(id);
const L="ABCD";
let px=0,sx=-1,i=0,si=0,res=[],locked=false,phase="menu";
const best=PERIODS.map(p=>p.sets.map(()=>null));

function clear(){["rail","meta","doc","ask","opts","fb","acts","tip"].forEach(k=>{$(k).innerHTML="";});}
function head(t,l,e){$("title").textContent=t;$("lede").textContent=l;$("eyebrow").textContent=e;}
function scroll(){window.scrollTo({top:0,behavior:"instant"});}
function act(label,style,fn){const b=document.createElement("button");b.className="btn "+style;b.textContent=label;b.onclick=fn;$("acts").appendChild(b);}
const P=()=>PERIODS[px];
const S=()=>P().sets[sx];

function tabs(){
  $("periods").innerHTML="";
  PERIODS.forEach((p,k)=>{
    const b=document.createElement("button");
    b.className="ptab"+(k===px?" sel":"");
    b.innerHTML=p.label+'<span class="yr">'+p.years+'</span>';
    b.setAttribute("aria-pressed",k===px?"true":"false");
    b.onclick=()=>{px=k;sx=-1;i=0;si=0;res=[];menu();};
    $("periods").appendChild(b);
  });
}

function menu(){
  phase="menu";sx=-1;clear();
  tabs();
  head(P().title,P().blurb,"United States history · advanced placement");
  $("art").innerHTML=ART[P().art];
  const wrap=document.createElement("div");wrap.className="list";
  P().sets.forEach((s,k)=>{
    const b=document.createElement("button");
    b.className="entry";
    const cnt=s.Q.length+" questions"+(s.SAQ?" · "+s.SAQ.length+" short answer":"");
    b.innerHTML='<span class="num">'+(k+1)+'</span><span><span class="t"></span><span class="d"></span><span class="d" style="margin-top:6px">'+cnt+'</span>'+(best[px][k]!==null?'<span class="s">Best score '+best[px][k]+' of '+s.Q.length+'</span>':'')+'</span>';
    b.querySelector(".t").textContent=s.n;
    b.querySelectorAll(".d")[0].textContent=s.d;
    b.onclick=()=>{sx=k;i=0;si=0;res=[];ask();};
    wrap.appendChild(b);
  });
  $("opts").className="";$("opts").appendChild(wrap);
  $("tip").textContent="Every excerpt is a public-domain primary source. Answer with the keys A to D or 1 to 4 if you prefer the keyboard.";
  scroll();
}

function rail(){
  const n=S().Q.length;let h='<div class="rail">';
  for(let k=0;k<n;k++){
    let c="seg";
    if(res[k]===true)c+=" hit";else if(res[k]===false)c+=" miss";else if(phase==="mc"&&k===i)c+=" now";
    h+='<div class="'+c+'"></div>';
  }
  $("rail").innerHTML=h+'</div>';
}
/* a question shows its own stimulus, or continues the previous one only if flagged */
function src(k){
  const Q=S().Q;
  if(Q[k].s)return Q[k];
  if(!Q[k].c)return null;
  let j=k;while(j>0&&!Q[j].s)j--;
  return Q[j].s?Q[j]:null;
}

function ask(){
  phase="mc";clear();tabs();
  const d=S().Q[i],st=src(i);
  head(S().n,S().d,P().label+" · "+P().years);
  $("art").innerHTML="";
  rail();
  $("meta").textContent="Question "+(i+1)+" of "+S().Q.length;
  if(st){
    $("doc").innerHTML='<div class="doc"><p class="src"></p><p class="qt"></p></div>';
    $("doc").querySelector(".src").textContent=st.s;
    $("doc").querySelector(".qt").textContent=st.t;
  }
  $("ask").innerHTML='<div class="ask"><span class="num">'+(i+1)+'</span><p></p></div>';
  $("ask").querySelector("p").textContent=d.q;
  $("opts").className="opts";
  d.o.forEach((txt,k)=>{
    const b=document.createElement("button");
    b.className="opt";
    b.innerHTML='<span class="badge">'+L[k]+'</span><span></span>';
    b.querySelector("span:last-child").textContent=txt;
    b.onclick=()=>pick(k);
    $("opts").appendChild(b);
  });
  locked=false;
  act("Leave this set","hollow",menu);
  $("tip").textContent="Press A to D or 1 to 4 to answer.";
  scroll();
}

function pick(k){
  if(locked)return;locked=true;
  const d=S().Q[i];res[i]=(k===d.a);
  rail();
  [...$("opts").children].forEach((b,n)=>{b.disabled=true;if(n===d.a)b.classList.add("right");else if(n===k)b.classList.add("wrong");});
  const box=document.createElement("div");
  box.className="said "+(res[i]?"y":"n");
  box.innerHTML='<b>'+(res[i]?"Correct":"Correct answer: "+L[d.a])+'</b><span></span>';
  box.querySelector("span").textContent=d.e;
  $("fb").appendChild(box);
  $("acts").innerHTML="";
  const last=i===S().Q.length-1;
  act(last?(S().SAQ?"Continue to short answer":"See results"):"Next question","solid",()=>{
    if(!last){i++;ask();}else if(S().SAQ){si=0;saq();}else results();
  });
  act("Leave this set","hollow",menu);
  $("tip").textContent="Press Enter to continue.";
}

function saq(){
  phase="saq";clear();tabs();
  const s=S().SAQ[si];
  head(S().n,"Short answer "+(si+1)+" of "+S().SAQ.length,P().label+" · "+P().years);
  $("art").innerHTML="";
  $("meta").textContent="Answer all three parts. Two to three sentences each.";
  $("doc").innerHTML='<div class="doc"><p class="src">Short answer question '+(si+1)+'</p><p class="qt"></p></div>';
  $("doc").querySelector(".qt").textContent=s.h;
  $("opts").className="";
  $("opts").innerHTML=s.q.map((t,k)=>'<div class="saqbox"><label class="part" for="t'+k+'"></label><textarea id="t'+k+'" rows="3"></textarea></div>').join("");
  [...$("opts").querySelectorAll(".part")].forEach((el,k)=>{el.textContent=s.q[k];});
  act("Compare with model answer","solid",()=>{
    if(s.q.some((_,k)=>!$("t"+k).value.trim())){$("fb").innerHTML='<p class="err">Write something for every part first.</p>';return;}
    $("fb").innerHTML='<div class="model"></div>';
    $("fb").querySelector(".model").textContent=s.m;
    $("acts").innerHTML="";
    act(si<S().SAQ.length-1?"Next question":"See results","solid",()=>{if(si<S().SAQ.length-1){si++;saq();}else results();});
    act("Leave this set","hollow",menu);
  });
  act("Leave this set","hollow",menu);
  s.q.forEach((_,k)=>$("t"+k).addEventListener("input",()=>{$("fb").innerHTML="";}));
  scroll();
}

function results(){
  phase="res";clear();tabs();
  const right=res.filter(Boolean).length,n=S().Q.length;
  if(best[px][sx]===null||right>best[px][sx])best[px][sx]=right;
  head(S().n,"","Results · "+P().label);
  $("lede").textContent="";
  $("art").innerHTML="";
  rail();
  $("meta").textContent="Multiple-choice score";
  $("doc").innerHTML='<p class="big">'+right+' <span class="of">of '+n+'</span></p>';
  const pct=right/n;
  const line=pct===1?"Clean sweep. Move on to the next set.":pct>=.8?"Solid. Read the explanations for the few you missed and move on.":pct>=.6?"Reasonable footing, but the misses below are worth a second pass through the chapter.":"Worth rereading the relevant AMSCO sections before retaking this one.";
  const v=document.createElement("p");v.className="verdict";v.textContent=line;$("ask").appendChild(v);
  const missed=S().Q.map((d,k)=>res[k]?null:{n:k+1,q:d.q}).filter(Boolean);
  $("opts").className="";
  $("opts").innerHTML=missed.map(m=>'<div class="miss"><span class="mn">'+m.n+'</span><span class="mq"></span></div>').join("");
  [...$("opts").querySelectorAll(".mq")].forEach((el,k)=>{el.textContent=missed[k].q;});
  act("Retake this set","hollow",()=>{i=0;si=0;res=[];ask();});
  act("Full answer key","solid",key);
  act("All sets","hollow",menu);
  scroll();
}

function key(){
  phase="key";clear();tabs();
  head(S().n,"",P().label+" · answer key");
  $("lede").textContent="";
  $("art").innerHTML="";
  $("meta").textContent="Every question, with the reasoning";
  $("opts").className="";
  $("opts").innerHTML=S().Q.map((d,k)=>'<div class="keyq"><p class="kq"><span class="mn">'+(k+1)+'</span><span class="kqt"></span></p><p class="ka"></p><p class="ke"></p></div>').join("");
  const blocks=[...$("opts").children];
  S().Q.forEach((d,k)=>{
    blocks[k].querySelector(".kqt").textContent=d.q;
    blocks[k].querySelector(".ka").textContent=L[d.a]+" — "+d.o[d.a];
    blocks[k].querySelector(".ke").textContent=d.e;
  });
  act("Retake this set","hollow",()=>{i=0;si=0;res=[];ask();});
  act("All sets","solid",menu);
  scroll();
}

document.addEventListener("keydown",ev=>{
  if(phase==="mc"&&!locked){
    const u=ev.key.toUpperCase();
    let k=L.indexOf(u);
    if(k<0&&"1234".includes(ev.key))k=+ev.key-1;
    if(k>=0&&k<S().Q[i].o.length){ev.preventDefault();pick(k);}
  }else if(ev.key==="Enter"&&phase==="mc"&&locked){
    const b=$("acts").querySelector(".solid");if(b){ev.preventDefault();b.click();}
  }
});
menu();
</script>
