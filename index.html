<style>
:root{
  --bg:#e9edef; --surface:#ffffff; --raise:#f4f7f8;
  --text:#0f2e4a; --text-2:#5b7286; --line:#cbd5db;
  --hdr-bg:#0f2e4a; --hdr-fg:#e8eef1; --hdr-line:#2d506e;
  --brass:#a2761f; --brass-lt:#d2a044;
  --ok:#2a7561; --ok-bg:#e2edea;
  --no:#8c2f2a; --no-bg:#f4e7e5;
  --shift:.16s cubic-bezier(.2,.7,.3,1);
}
@media (prefers-color-scheme:dark){
:root{
  --bg:#0b1b26; --surface:#132735; --raise:#18303f;
  --text:#e6edf1; --text-2:#93a8b8; --line:#26404f;
  --hdr-bg:#081720; --hdr-fg:#e6edf1; --hdr-line:#22404f;
  --brass:#d6a64b; --brass-lt:#e8c887;
  --ok:#5fbfa3; --ok-bg:#14332c;
  --no:#e08079; --no-bg:#331a1a;
}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.62}
.band{background:var(--hdr-bg);color:var(--hdr-fg);overflow:hidden}
.inner{max-width:680px;margin:0 auto;padding:0 22px}
.band .inner{padding-top:14px;padding-bottom:0}

/* period navigation */
.periods{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}
.ptab{
  font:inherit;font-size:14px;font-weight:500;color:var(--hdr-fg);
  background:transparent;border:1px solid var(--hdr-line);border-radius:999px;
  padding:7px 16px;cursor:pointer;opacity:.7;min-height:38px;
  transition:opacity var(--shift),background var(--shift),border-color var(--shift);
}
.ptab .yr{opacity:.65;margin-left:7px;font-variant-numeric:lining-nums}
.ptab:hover{opacity:1;border-color:var(--brass-lt)}
.ptab.sel{opacity:1;background:var(--brass);border-color:var(--brass);color:#fff}
.ptab.sel .yr{opacity:.8}
.ptab:focus-visible{outline:2px solid var(--brass-lt);outline-offset:2px}

.eyebrow{font-size:13.5px;opacity:.7;margin:0 0 7px}
h1{font-family:Fraunces,Georgia,serif;font-optical-sizing:auto;font-size:36px;font-weight:500;line-height:1.08;letter-spacing:-.018em;margin:0}
.lede{margin:11px 0 0;font-size:15px;opacity:.78;max-width:46ch}
.art{margin:16px -22px 0;line-height:0}
.art svg{width:100%;height:auto;display:block}
main{padding:30px 0 80px}

.list{border-top:1px solid var(--line)}
.entry{display:flex;gap:20px;align-items:flex-start;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:20px 12px 20px 4px;font:inherit;color:var(--text);cursor:pointer;transition:background var(--shift),padding var(--shift)}
.entry:hover{background:var(--raise);padding-left:12px;padding-right:4px}
.entry:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
.num{font-family:Fraunces,Georgia,serif;font-size:34px;font-weight:400;line-height:1;color:var(--brass);flex:none;width:44px;padding-top:2px;font-variant-numeric:lining-nums}
.entry .t{font-size:18.5px;font-weight:500;line-height:1.3;margin:0 0 4px;display:block}
.entry .d{font-size:14.5px;color:var(--text-2);margin:0;display:block}
.entry .s{font-size:13.5px;color:var(--ok);margin:8px 0 0;font-weight:500;display:block}

.rail{display:flex;gap:4px;margin:0 0 22px}
.seg{flex:1;height:6px;background:var(--line);border-radius:99px;transition:background var(--shift)}
.seg.now{background:var(--brass)}.seg.hit{background:var(--ok)}.seg.miss{background:var(--no)}
.meta{font-size:13.5px;color:var(--text-2);margin:0 0 24px}

.doc{background:var(--surface);border-left:3px solid var(--brass);padding:19px 22px;margin:0 0 26px}
.doc .src{font-size:13px;color:var(--text-2);margin:0 0 9px}
.doc .qt{font-family:Fraunces,Georgia,serif;font-size:17.5px;line-height:1.62;margin:0;letter-spacing:.005em}

.ask{display:flex;gap:20px;align-items:flex-start;margin:0 0 22px}
.ask .num{font-size:30px}
.ask p{font-size:18px;line-height:1.45;margin:2px 0 0;letter-spacing:-.005em}
.opts{display:flex;flex-direction:column;gap:8px;margin-left:64px}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:3px solid transparent;border-radius:3px;padding:13px 16px;font:inherit;font-size:15.5px;line-height:1.5;color:var(--text);cursor:pointer;min-height:48px;transition:border-color var(--shift),background var(--shift),transform var(--shift)}
.opt:hover:not(:disabled){border-left-color:var(--brass);transform:translateX(3px)}
.opt:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.opt:disabled{cursor:default}
.badge{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;color:var(--text-2);margin-top:1px;transition:all var(--shift)}
.opt.right{background:var(--ok-bg);border-color:var(--ok);border-left-color:var(--ok)}
.opt.right .badge{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{background:var(--no-bg);border-color:var(--no);border-left-color:var(--no)}
.opt.wrong .badge{background:var(--no);border-color:var(--no);color:var(--surface)}

.said{margin:22px 0 0 64px;padding:17px 20px;background:var(--surface);border-left:3px solid var(--brass);font-size:15px;line-height:1.65}
.said.y{border-left-color:var(--ok)}.said.n{border-left-color:var(--no)}
.said b{font-weight:600;display:block;margin-bottom:5px;font-size:14px}
.said.y b{color:var(--ok)}.said.n b{color:var(--no)}

.part{display:block;font-size:16.5px;line-height:1.5;margin:0 0 9px}
textarea{width:100%;font:inherit;font-size:16px;line-height:1.55;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:3px;color:var(--text);resize:vertical;transition:border-color var(--shift)}
textarea:focus{outline:none;border-color:var(--brass);border-left-color:var(--brass)}
.saqbox{margin-bottom:20px}
.err{color:var(--no);font-size:14px;margin:12px 0 0;font-weight:500}
.model{white-space:pre-wrap;font-size:15px;line-height:1.72;margin:22px 0 0;padding:19px 22px;background:var(--surface);border-left:3px solid var(--brass)}

.big{font-family:Fraunces,Georgia,serif;font-size:72px;font-weight:500;line-height:.95;letter-spacing:-.03em;margin:6px 0 0}
.big .of{font-size:26px;color:var(--text-2);font-weight:400;letter-spacing:0}
.verdict{font-size:15.5px;color:var(--text-2);margin:14px 0 30px;max-width:46ch}
.miss{display:flex;gap:16px;padding:15px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.45}
.miss .mn{font-family:Fraunces,Georgia,serif;font-size:19px;color:var(--brass);flex:none;width:26px}
.keyq{padding:20px 0;border-bottom:1px solid var(--line)}
.keyq .kq{font-size:16.5px;font-weight:500;line-height:1.45;margin:0 0 10px;display:flex;gap:16px}
.keyq .kq .mn{font-family:Fraunces,Georgia,serif;font-size:19px;font-weight:400;color:var(--brass);flex:none;width:26px}
.keyq .ka{font-size:15px;color:var(--ok);margin:0 0 8px 42px;font-weight:500}
.keyq .ke{font-size:15px;color:var(--text-2);margin:0 0 0 42px;line-height:1.65}

.acts{margin-top:34px;display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-size:15.5px;font-weight:500;padding:13px 24px;min-height:48px;border-radius:3px;cursor:pointer;flex:1;min-width:150px;transition:background var(--shift),color var(--shift),border-color var(--shift)}
.solid{background:var(--text);color:var(--bg);border:1px solid var(--text)}
.solid:hover{background:var(--brass);border-color:var(--brass);color:#fff}
.hollow{background:none;color:var(--text);border:1px solid var(--line)}
.hollow:hover{border-color:var(--brass);color:var(--brass)}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.tip{font-size:13px;color:var(--text-2);margin:30px 0 0;padding-top:16px;border-top:1px solid var(--line)}
@media (max-width:560px){
  h1{font-size:29px}.inner{padding:0 17px}.art{margin-left:-17px;margin-right:-17px}
  .opts,.said{margin-left:0}.ask{gap:14px}.ask .num{font-size:25px;width:32px}
  .num{width:36px;font-size:29px}.entry{gap:14px}.big{font-size:58px}.doc{padding:17px 18px}
  .keyq .ka,.keyq .ke{margin-left:0}
  .ptab{font-size:13px;padding:6px 13px}
}
</style>
</head>

<script>
const PERIODS=[{"label":"Period 3","years":"1754–1800","art":"p3","title":"Period Three","blurb":"From the Seven Years War through the imperial crisis, the Revolution, the Articles, the Constitution, and the first party system.","sets":[{"n":"Full practice test","d":"Topics 3.6 to 3.9 · fifteen stimulus questions across five documents, then two short-answer questions","Q":[{"s":"Abigail Adams, letter to John Adams, March 31, 1776","t":"…in the new Code of Laws which I suppose it will be necessary for you to make I desire you would Remember the Ladies, and be more generous and favourable to them than your ancestors. Do not put such unlimited power into the hands of the Husbands. Remember all Men would be tyrants if they could.","q":"Adams's request is best understood as evidence of which broader development?","o":["A coordinated women's suffrage movement organized during the war","The replacement of English common law with a uniform national legal code","Widespread colonial acceptance of legal equality between men and women","Revolutionary rhetoric about liberty prompting groups excluded from power to press their own claims"],"a":3,"e":"The war's language of natural rights, consent and tyranny was picked up by women, enslaved people and others to argue their own case. No organized suffrage movement existed until Seneca Falls in 1848, and common-law coverture survived intact."},{"q":"Which outcome most directly limited the kind of change Adams was asking for?","o":["Congress explicitly banned women from owning property","State constitutions written in the 1770s and 1780s generally left coverture intact","The Northwest Ordinance restricted married women's westward migration","The Constitution of 1787 defined voters as male in every state"],"a":1,"e":"Coverture — a wife's legal identity absorbed into her husband's — came through the Revolution nearly untouched. The Constitution left suffrage to the states, and New Jersey allowed some propertied women to vote until 1807.","c":1},{"q":"Which ideal best describes how women's civic role was most commonly defined in the 1780s and 1790s?","o":["Companionate suffrage","Republican motherhood","The cult of true womanhood","Separate spheres industrial domesticity"],"a":1,"e":"Republican motherhood held that women served the republic by raising virtuous, informed sons. It justified expanded female education — Judith Sargent Murray, Benjamin Rush — without granting political rights. The cult of domesticity is a later, antebellum development.","c":1},{"s":"Northwest Ordinance, 1787","t":"…whenever any of the said States shall have sixty thousand free inhabitants therein, such State shall be admitted, by its delegates, into the Congress of the United States, on an equal footing with the original States… There shall be neither slavery nor involuntary servitude in the said territory.","q":"The Ordinance is most significant because it","o":["Abolished slavery throughout the United States","Established a permanent colonial relationship between the East and the West","Extinguished all Native American land claims north of the Ohio River","Created an orderly procedure by which territories could become states equal to the original thirteen"],"a":3,"e":"This is the Confederation government's great achievement: it rejected a colonial model in favor of equal statehood, and its slavery ban made the Ohio River a sectional dividing line. The ban applied only to the Northwest Territory."},{"q":"The Ordinance illustrates which contrast in the Confederation government's powers?","o":["It could raise a standing army but could not negotiate treaties","It could organize western lands but could not levy taxes to fund the government","It could regulate interstate commerce but not foreign trade","It could amend the Articles by majority vote but could not admit new states"],"a":1,"e":"Congress controlled the western domain yet could only requisition funds from the states, never tax. Amendment required unanimity, and commercial regulation was also beyond its reach.","c":1},{"q":"The Land Ordinance of 1785 was designed primarily to","o":["Redistribute Loyalist estates to Continental Army veterans","Guarantee Native American nations title to land west of the Appalachians","Generate revenue by surveying and selling western land in townships","Repay French war loans with land grants"],"a":2,"e":"Rectangular survey into 36-square-mile townships, one section reserved to fund public schools. Land sales were the workaround for having no taxing power.","c":1},{"s":"George Washington to Henry Lee, October 31, 1786","t":"You talk, my good Sir, of employing influence to appease the present tumults in Massachusetts. I know not where that influence is to be found; and if attainable, that it would be a proper remedy for the disorders. Influence is no Government. Let us have one by which our lives, liberties and properties will be secured, or let us know the worst at once.","q":"The tumults Washington refers to were driven most directly by","o":["Enslaved people organizing revolts in the Connecticut River valley","Merchants protesting British seizure of American ships","Backcountry farmers facing debt suits, foreclosures and hard-money taxes","Frontier settlers resisting the Northwest Ordinance's slavery ban"],"a":2,"e":"Shays's Rebellion, 1786 to 1787: indebted western Massachusetts farmers, many of them veterans, shut down courts to stop foreclosures after the state demanded taxes in specie."},{"q":"Washington's reaction is most useful as evidence of","o":["Growing elite conviction that the Articles could not secure order or property","Popular support for annual constitutional conventions","Broad public demand for a hereditary executive","Southern planters' fear of a federal ban on the slave trade"],"a":0,"e":"The rebellion was put down by a privately financed militia rather than a national force. Elite alarm at exactly that fact fed the push for the Philadelphia Convention.","c":1},{"q":"Which sequence correctly orders these events?","o":["Philadelphia Convention, Shays's Rebellion, Annapolis Convention, ratification","Shays's Rebellion, Annapolis Convention, Philadelphia Convention, ratification","Annapolis Convention, Shays's Rebellion, Philadelphia Convention, ratification","Shays's Rebellion, Philadelphia Convention, Annapolis Convention, ratification"],"a":1,"e":"A deliberately tricky one. Shays's Rebellion ran from August 1786 to February 1787 and Annapolis met September 11 to 14, 1786, so they overlap — but the causal chain the exam tests runs unrest, then Annapolis's call for a broader convention, then Philadelphia in May 1787, then ratification in 1787 and 1788.","c":1},{"s":"Brutus, Anti-Federalist essay No. 1, October 1787","t":"In a republic, the manners, sentiments, and interests of the people should be similar. If not, there will be a constant clashing of opinions; and the representatives of one part will be continually striving against those of the other… In a large extended country, it is impossible to have a representation, possessing the sentiments, and of integrity, to declare the minds of the people.","q":"The author's central objection to the proposed Constitution is that","o":["It gave too much power to the individual states","It permitted the direct election of senators","It failed to provide for a national army","A republic covering so vast a territory could not remain genuinely representative"],"a":3,"e":"Anti-Federalists drew on Montesquieu: republics survive only when small and homogeneous. They also feared a distant government would fall to an aristocratic few. Senators were chosen by state legislatures until 1913."},{"q":"Madison's most influential rebuttal to this argument held that","o":["A strong executive is the only reliable check on popular passions","States should retain the power to nullify federal law","A large republic makes it harder for any single faction to form a tyrannical majority","Factions should be suppressed by law before they can organize"],"a":2,"e":"Federalist No. 10 inverts the classical view: extend the sphere and you multiply interests, so no one faction can dominate. Madison argued you cure the effects of faction, not its causes.","c":1},{"q":"Which concession did Federalists make that proved decisive in securing ratification?","o":["Agreeing that amendments could pass by simple majority","Promising to add a bill of rights in the first Congress","Accepting direct popular election of the president","Guaranteeing each state an equal vote in the House"],"a":1,"e":"Massachusetts ratified only on that understanding and other states followed. Madison drafted the amendments; ten were ratified in 1791. Hamilton had argued in Federalist No. 84 that a bill of rights was unnecessary and even dangerous.","c":1},{"s":"James Madison, Federalist No. 51, 1788","t":"…the great security against a gradual concentration of the several powers in the same department, consists in giving to those who administer each department the necessary constitutional means and personal motives to resist encroachments of the others. Ambition must be made to counteract ambition.","q":"Madison is describing which constitutional principle?","o":["Popular sovereignty","Judicial review","Concurrent majority","Checks and balances among separated branches"],"a":3,"e":"Separation of powers alone isn't enough for Madison — each branch needs both the tools and the self-interest to push back. Judicial review is not in the text; the Court asserted it in Marbury v. Madison, 1803."},{"q":"Which provision best exemplifies the mechanism Madison describes?","o":["The guarantee of a republican form of government to every state","The Three-Fifths Compromise","The presidential veto, which Congress may override by a two-thirds vote","The requirement that revenue bills originate in the House"],"a":2,"e":"Veto and override is the textbook case of one branch checking another. The origination clause governs House and Senate relations inside a single branch, so it isn't interbranch checking.","c":1},{"q":"Federalist No. 51 also defends federalism, which the Constitution establishes by","o":["Granting the national government only powers expressly enumerated in the Articles","Requiring unanimous state consent for federal legislation","Making state legislatures the sole source of all federal authority","Dividing sovereignty between national and state governments, with the supremacy clause resolving conflicts"],"a":3,"e":"Madison called it a compound republic — a double security, since power is divided between two levels and then subdivided within each. Article VI's supremacy clause settles conflicts in favor of federal law.","c":1}],"SAQ":[{"h":"The Articles of Confederation","q":["a) Briefly describe ONE specific accomplishment of the government under the Articles of Confederation.","b) Briefly describe ONE specific weakness of the Articles that contributed to calls for a new constitution.","c) Briefly explain ONE specific way the Constitution of 1787 addressed the weakness you identified in part b."],"m":"a) Acceptable: the Land Ordinance of 1785, with its systematic survey and sale of western land and a section reserved for schools; the Northwest Ordinance of 1787, with its orderly path to equal statehood and slavery ban north of the Ohio; winning the war and negotiating the Treaty of Paris in 1783.\n\nb) Acceptable: no power to tax, only to requisition from states; no power to regulate interstate or foreign commerce; no national executive or judiciary; amendment required unanimous consent; no power to raise a national army, as Shays's Rebellion exposed; states issued rival currencies and taxed one another's goods.\n\nc) Must connect directly to part b. Examples: Article I, Section 8 gives Congress power to lay and collect taxes; the commerce clause grants authority over interstate and foreign trade; Article II creates a single executive commanding the armed forces; Article V allows amendment by three-fourths of the states rather than unanimity.\n\nScoring: each part is worth 1 point on the real exam. Part c earns credit only if the remedy logically matches the weakness named in b."},{"h":"The reach and limits of revolutionary ideals","q":["a) Briefly describe ONE specific way revolutionary ideals changed the status of women or of enslaved and free Black Americans between 1775 and 1800.","b) Briefly describe ONE specific way those same ideals failed to produce change for that group.","c) Briefly explain ONE way the American Revolution influenced political movements outside the United States before 1830."],"m":"a) Acceptable: every northern state adopted gradual emancipation or abolished slavery between 1777 and 1804, including Vermont in 1777, Pennsylvania in 1780 and the Massachusetts Quock Walker decision in 1783; a rise in private manumissions in the Upper South; the 1787 ban on slavery in the Northwest Territory; free Black institutions such as Richard Allen's African Methodist Episcopal Church; republican motherhood justifying expanded female education, as in Judith Sargent Murray's writing.\n\nb) Acceptable: slavery expanded in the South and gained constitutional protection through the three-fifths clause, the fugitive slave clause and the twenty-year bar on ending the international slave trade; coverture left married women without independent legal or property rights; women were denied the vote almost everywhere, and New Jersey revoked propertied women's suffrage in 1807.\n\nc) Acceptable: the Declaration's natural-rights language echoed in the 1789 Declaration of the Rights of Man; the Haitian Revolution from 1791; Latin American independence movements under Bolívar and others in the 1810s and 1820s; the US Constitution as a model for written constitutions abroad.\n\nScoring: part b should identify real historical continuity, not merely assert that nothing changed."}]},{"n":"The Seven Years' War","d":"Topic 3.2 · empire, victory, debt, and the road to the imperial crisis","Q":[{"q":"Fighting between Britain and France in North America began in 1754 over","o":["Control of the Ohio River valley, where a young George Washington was defeated at Fort Necessity","The border between Georgia and Spanish Florida","French support for a Native uprising in New England","Fishing rights off Newfoundland"],"a":0,"e":"Both empires, along with the Ohio Company, claimed the forks of the Ohio. Washington's surrender at Fort Necessity in July 1754 helped touch off a war that soon spread to Europe and beyond."},{"q":"The Albany Plan of Union (1754) is significant because it","o":["Was adopted as the basis for the Articles of Confederation","Created the first permanent colonial government","Proposed an intercolonial government for defense and was rejected by both colonial assemblies and the Crown","Established the Continental Congress"],"a":2,"e":"Franklin's plan, and his Join or Die cartoon, show that colonial union was already imaginable in 1754. Its rejection by every assembly shows how little appetite existed for surrendering local authority — a pattern that recurs straight through the 1780s."},{"q":"Under the Treaty of Paris of 1763,","o":["France was effectively expelled from mainland North America, with Britain gaining Canada and land east of the Mississippi","Spain gained Canada and Britain gained Louisiana","France retained the Ohio valley but lost Quebec","Britain returned Florida to Spain"],"a":0,"e":"Spain ceded Florida to Britain and received Louisiana from France. The removal of French power is the single most consequential outcome, both for colonists and for Native nations."},{"q":"The war's most important consequence for British imperial policy was","o":["The abandonment of mercantilism","A decision to grant colonial assemblies representation in Parliament","An enormous national debt and the conclusion that the colonies should help pay for their own defense","A withdrawal of all troops from North America"],"a":2,"e":"British debt roughly doubled. Grenville's revenue measures beginning in 1764 follow directly from that arithmetic, and they end the long era of salutary neglect."},{"q":"Pontiac's Rebellion in 1763 led most directly to","o":["The Albany Plan of Union","The Proclamation of 1763, barring colonial settlement west of the Appalachians","The repeal of the Navigation Acts","The Quartering Act of 1765"],"a":1,"e":"Britain wanted to avoid the cost of another frontier war. Colonists, especially veterans expecting western land as a reward for service, read the line as a betrayal — the first serious postwar grievance."},{"q":"For Native nations in the interior, the French defeat was damaging because","o":["It ended all treaty-making with European powers","It eliminated the fur trade entirely","It forced their immediate removal beyond the Mississippi","It ended their ability to play rival European powers against one another for trade goods and diplomatic leverage"],"a":3,"e":"Balancing empires had been the core of Native diplomacy in the interior. British policy under Amherst also cut back gift-giving, which Native leaders understood as a rupture of alliance obligations."},{"q":"Colonial militiamen who served alongside British regulars frequently came away","o":["Resentful of British officers' condescension and of practices like impressment and quartering","Convinced of the superiority of British military discipline","Persuaded that the colonies should seek union with France","Eager to join the regular army permanently"],"a":0,"e":"Friction over rank, pay and discipline mattered later: it gave colonists both military experience and a sense of being treated as inferiors within the empire."},{"q":"The phrase 'salutary neglect' refers to","o":["The Crown's failure to defend the frontier during the war","Britain's long-standing loose enforcement of trade regulations in the colonies before 1763","Parliament's refusal to seat colonial representatives","The colonial policy of ignoring Native land claims"],"a":1,"e":"Walpole-era Britain regulated on paper and enforced lightly, which let colonial self-government develop. Tightened enforcement after 1763 felt to colonists like innovation, not restoration."},{"q":"Writs of assistance, challenged by James Otis in 1761, were","o":["General search warrants allowing customs officers to search for smuggled goods without naming a specific place","Documents certifying colonial militia service","Permits for westward settlement","Licenses required for colonial printing presses"],"a":0,"e":"Otis argued they violated fundamental English liberties. The episode previews the constitutional character of later colonial arguments and eventually informs the Fourth Amendment."},{"q":"Which statement best captures the war's paradoxical effect on the empire?","o":["The war united colonists and Britons in a lasting imperial partnership","Victory removed the French threat that had made colonists dependent on British protection, while creating the debt that drove Britain to tax them","The war had little effect on colonial politics","Defeat forced Britain to grant the colonies independence"],"a":1,"e":"This is the standard causal framing for the period and a reliable thesis for an essay: the moment of greatest imperial triumph set up the crisis that broke the empire apart."}]},{"n":"Taxation without representation","d":"Topic 3.3 · imperial measures and colonial resistance, 1764 to 1775","Q":[{"q":"The Sugar Act of 1764 differed from earlier trade laws because it","o":["Was passed by colonial assemblies","Applied only to the southern colonies","Taxed land rather than goods","Was intended to raise revenue rather than only to regulate trade, and was enforced in vice-admiralty courts without juries"],"a":3,"e":"It actually lowered the molasses duty while enforcing it seriously. The revenue purpose and the trial-without-jury provision are what made it a constitutional grievance rather than a commercial nuisance."},{"q":"Colonial resistance to the Stamp Act of 1765 included","o":["A petition asking for colonial seats in Parliament, which was granted","The immediate formation of a continental army","The Stamp Act Congress, nonimportation agreements, and crowd action by the Sons of Liberty","An armed march on Quebec"],"a":2,"e":"The Stamp Act touched lawyers, printers and merchants at once, which is why resistance was unusually broad. Parliament repealed it in 1766 — and passed the Declaratory Act the same day."},{"q":"The Declaratory Act of 1766 asserted that Parliament","o":["Recognized colonial assemblies as equal to Parliament","Would never again tax the colonies","Would grant the colonies representation within seven years","Had authority to bind the colonies in all cases whatsoever"],"a":3,"e":"Repeal without retreat. Colonists celebrated the first half and largely ignored the second, but the Declaratory Act frames every dispute that follows."},{"q":"The British doctrine of virtual representation held that","o":["Colonial assemblies were branches of Parliament","Colonists could elect representatives once their population reached a set threshold","Royal governors spoke for the colonies in Parliament","Members of Parliament represented the interests of all British subjects, whether or not those subjects elected them"],"a":3,"e":"Colonists countered with actual representation — the idea that a representative must be chosen by, and accountable to, the people taxed. Daniel Dulany's pamphlet is the best-known reply."},{"q":"The Townshend Acts of 1767 provoked opposition largely because they","o":["Taxed imported goods such as glass, paper and tea to pay royal officials' salaries, making those officials independent of colonial assemblies","Banned all colonial manufacturing","Abolished colonial courts","Required colonists to quarter troops in private homes"],"a":0,"e":"The salary provision was the sharp edge: the power of the purse was the assemblies' main leverage over governors. The Massachusetts Circular Letter and renewed nonimportation followed."},{"q":"Daughters of Liberty contributed to colonial resistance primarily by","o":["Petitioning Parliament for the vote","Serving in colonial militias","Publishing the Massachusetts Circular Letter","Producing homespun cloth and enforcing boycotts of British goods"],"a":3,"e":"Boycotts depended on household consumption decisions, which made women's participation structurally necessary. This is the standard evidence for the politicizing of the household before 1776."},{"q":"The Tea Act of 1773 angered colonists even though it","o":["Lowered the price of tea, because it granted the East India Company a monopoly and implicitly upheld Parliament's right to tax","Banned tea consumption in the colonies","Raised tea duties to their highest level yet","Applied only to Massachusetts"],"a":0,"e":"Cheap taxed tea was a trap: buying it would concede the principle. Merchants cut out of the trade and radicals defending the constitutional point aligned against it, and the Boston Tea Party followed in December."},{"q":"The Coercive Acts of 1774 included","o":["Dissolving all colonial assemblies","Establishing an Anglican bishop in every colony","Imposing a direct tax on colonial land","Closing the port of Boston and restructuring the Massachusetts government"],"a":3,"e":"Punishment aimed at one colony, plus the Administration of Justice and Quartering provisions. The Quebec Act, passed the same year and lumped in by colonists, extended Quebec's boundary to the Ohio and tolerated Catholicism."},{"q":"The First Continental Congress of 1774 responded by","o":["Sending representatives to sit in Parliament","Declaring independence","Raising an army and appointing Washington","Adopting the Continental Association, a comprehensive boycott, and issuing a declaration of rights and grievances"],"a":3,"e":"Twelve colonies attended; Georgia did not. Enforcement fell to local committees, which became a functioning shadow government — an important step toward independence even while Congress was still petitioning the king."},{"q":"Committees of correspondence mattered because they","o":["Drafted the Declaration of Independence","Served as the colonies' official diplomatic corps in Europe","Built an intercolonial communication network that coordinated resistance and shaped public opinion","Collected taxes for the Continental Congress"],"a":2,"e":"Samuel Adams organized the Boston committee in 1772; Virginia created an intercolonial version in 1773. Without this infrastructure, coordinated response to the Coercive Acts would have been far slower."}]},{"n":"Philosophical foundations","d":"Topic 3.4 · Enlightenment thought, republicanism, and the case for independence","Q":[{"q":"John Locke's Second Treatise supplied colonists with the argument that","o":["Property should be held in common","Only a hereditary aristocracy can govern wisely","Monarchy is divinely ordained","Government rests on consent and exists to protect natural rights, and may be replaced when it fails to do so"],"a":3,"e":"Locke's frame — natural rights, consent, the right of revolution — structures the Declaration's second paragraph almost directly."},{"q":"Montesquieu's influence on American political thought is clearest in the idea that","o":["Legislatures should meet only in emergencies","Executive authority should be hereditary","Power should be divided among separate branches that check one another","Republics require a state religion"],"a":2,"e":"Note that Anti-Federalists used Montesquieu too, for his claim that republics must be small. Both sides in 1787 and 1788 were quoting the same author."},{"q":"The Great Awakening contributed to the revolutionary era by","o":["Discouraging political participation among ordinary people","Establishing a national church","Encouraging colonists to question inherited authority and creating shared intercolonial experience across denominations","Uniting colonists behind the Anglican hierarchy"],"a":2,"e":"New Light itinerants modeled challenges to established authority and drew audiences across colonial lines. Historians debate how directly this fed into politics, but the habit of dissent transferred."},{"q":"Thomas Paine's Common Sense (1776) was influential mainly because it","o":["Defended reconciliation with Britain under a reformed empire","Argued in plain, forceful language that monarchy itself was illegitimate and independence the only sensible course","Offered a detailed constitutional design for the new nation","Was written for an elite legal audience"],"a":1,"e":"Before Paine, most colonists blamed Parliament and ministers rather than the king or monarchy as such. Attacking hereditary rule directly, in accessible prose and enormous print runs, is what shifted opinion in the first half of 1776."},{"q":"The structure of the Declaration of Independence moves from","o":["A religious appeal, to a military plan, to a declaration of war","A list of grievances, to a theory of rights, to a request for reconciliation","A statement of natural-rights philosophy, to a list of grievances against the king, to a formal declaration of independence","A history of the colonies, to a plan of union, to a treaty proposal"],"a":2,"e":"Knowing the structure is genuinely useful on document questions. Note that the grievances are addressed to George III rather than Parliament, which is the logical endpoint of Paine's argument."},{"q":"Republicanism, as understood in the 1770s, emphasized","o":["Unlimited majority rule","Civic virtue and the sacrifice of private interest for the common good, with corruption as the chief danger","Direct democracy on all questions","The necessity of a hereditary upper house"],"a":1,"e":"This vocabulary of virtue and corruption runs through the entire period. It explains why standing armies, patronage and public debt were viewed with such suspicion in the 1780s and 1790s."},{"q":"Jefferson's original draft of the Declaration included a passage that was struck out because","o":["It attacked Parliament rather than the king","It criticized the slave trade and drew objections from delegates in South Carolina and Georgia","It called for the abolition of all state governments","It proposed immediate war with Spain"],"a":1,"e":"The excised passage blamed the king for the slave trade. Its removal is the sharpest available illustration of the gap between the Declaration's universal language and the politics of 1776."},{"q":"Loyalists are best described as","o":["Roughly a fifth of the colonial population, drawn from varied backgrounds including officials, some merchants, recent immigrants and enslaved people seeking freedom","A negligible handful of royal officials","Colonists who supported Parliament's right to tax but opposed the king","A regional group confined to Georgia"],"a":0,"e":"Recent estimates run about 15 to 20 percent. The thirds often attributed to John Adams are a misreading — that 1813 letter was describing the French Revolution. The Revolution was also a civil war, and tens of thousands of Loyalists left for Canada, Britain and the Caribbean."},{"q":"Enslaved people and free Black writers such as Phillis Wheatley responded to revolutionary rhetoric by","o":["Turning the language of liberty against slavery, including in freedom petitions submitted to colonial legislatures","Uniformly supporting the Loyalist cause","Avoiding political expression entirely","Rejecting natural-rights arguments as irrelevant to them"],"a":0,"e":"Enslaved petitioners in Massachusetts used exactly the colonists' own vocabulary in the 1770s. This is strong evidence that revolutionary ideology escaped the control of those who deployed it."},{"q":"The phrase 'consent of the governed' was most directly useful to colonists as","o":["A justification for the Proclamation of 1763","An argument for a hereditary senate","A refutation of virtual representation and of Parliament's claim to tax them","A defense of the Navigation Acts"],"a":2,"e":"If legitimate authority rests on consent, a legislature colonists did not elect cannot tax them. The principle also cuts inward, which is why the same words appear in freedom petitions and in Abigail Adams's letter."}]},{"n":"The American Revolution","d":"Topic 3.5 · the war, its participants, and the peace","Q":[{"q":"The Second Continental Congress took which step in 1775?","o":["Appointed Washington to command the Continental Army while still sending the Olive Branch Petition to the king","Signed a formal alliance with France","Dissolved the colonial assemblies","Declared independence immediately"],"a":0,"e":"Fighting and petitioning at the same time captures the ambivalence of 1775. George III's rejection of the petition and his Proclamation of Rebellion closed off the reconciliation option."},{"q":"The Battle of Saratoga in 1777 is considered the war's turning point because it","o":["Ended the fighting in the North permanently","Persuaded France to enter the war openly as an American ally","Captured the British army at Yorktown","Secured the Ohio valley for the United States"],"a":1,"e":"The French alliance of 1778 converted a colonial rebellion into a global war, stretching British resources across the Caribbean, the Mediterranean and India."},{"q":"Dunmore's Proclamation of 1775 offered freedom to","o":["Enslaved men belonging to rebels who would join British forces","Native allies of the British","Loyalist prisoners of war","All enslaved people in the colonies"],"a":0,"e":"It was a military measure, not an antislavery one, and applied only to those held by Patriots. Tens of thousands of enslaved people nonetheless sought British lines during the war, and Black Loyalists later evacuated to Nova Scotia and Sierra Leone."},{"q":"The Iroquois Confederacy during the Revolution","o":["Allied with France","Sided unanimously with the Americans","Split apart, with most nations siding with Britain while the Oneida and Tuscarora supported the Americans","Remained entirely neutral"],"a":2,"e":"The split ended the Confederacy's long-standing unity. Sullivan's 1779 campaign destroyed about forty Haudenosaunee towns along with some 160,000 bushels of corn, and the 1783 peace ignored Native claims entirely."},{"q":"Von Steuben's contribution at Valley Forge was to","o":["Negotiate the French alliance","Command the southern campaign","Design the army's supply system","Standardize drill and discipline, substantially improving the Continental Army's effectiveness"],"a":3,"e":"Valley Forge is better understood as a training and reorganization episode than simply a story of suffering, though between 1,700 and 2,000 of the roughly 12,000 encamped died there of disease and exposure."},{"q":"The siege of Yorktown in 1781 succeeded because","o":["The Continental Army outnumbered the British ten to one","Spain invaded Canada simultaneously","Cornwallis was trapped between Washington's combined army and a French fleet controlling the Chesapeake","The British army mutinied"],"a":2,"e":"De Grasse's fleet cut off escape and reinforcement by sea. French naval power, more than any single American battlefield victory, produced the decisive result."},{"q":"Women's wartime contributions included","o":["Formal service as commissioned officers","Managing farms and businesses, serving as camp followers providing essential labor, and in rare cases enlisting in disguise","Exclusive control of wartime finance","Voting in Continental Congress elections"],"a":1,"e":"Camp followers cooked, nursed and laundered for the army and were counted in its logistics. Deborah Sampson is the best-documented case of a woman who enlisted under a male identity."},{"q":"Which factor best explains the American victory?","o":["Consistent battlefield superiority over British regulars","British unwillingness to commit troops","Overwhelming numerical superiority in every engagement","A combination of French military and financial aid, British logistical difficulty across an ocean, and Washington's strategy of preserving his army rather than risking it"],"a":3,"e":"Washington lost more battles than he won. Keeping a Continental Army in the field denied Britain the decisive victory it needed, while France supplied money, troops and the navy."},{"q":"Under the Treaty of Paris of 1783, the United States","o":["Retained dominion status within the empire","Ceded Florida to Spain","Gained independence and territory west to the Mississippi, and agreed that Loyalist property claims and prewar debts would be honored","Gained independence but no territory beyond the original thirteen states"],"a":2,"e":"Jay, Franklin and Adams negotiated generous boundaries. The debt and Loyalist provisions were never honored by the states, which gave Britain its justification for holding the northwestern posts."},{"q":"For Native nations, the 1783 settlement was catastrophic primarily because","o":["It required their immediate removal west of the Mississippi","It abolished all trade with Europeans","Britain transferred territory to the United States without consulting or including the nations who lived on it","It dissolved all existing treaties with Britain and France alike"],"a":2,"e":"Nations that had not been defeated found their land claimed by a new government that treated them as conquered peoples. Armed resistance in the Ohio country continued until Fallen Timbers in 1794."}]},{"n":"The influence of revolutionary ideals","d":"Topic 3.6 · religion, slavery, women, Native nations, global echoes","Q":[{"q":"The Virginia Statute for Religious Freedom, drafted by Jefferson and enacted in 1786, is most significant because it","o":["Barred clergy from holding public office anywhere in the United States","Ended state support for an established church and became a model for the First Amendment","Established Presbyterianism as Virginia's official church","Required officeholders to swear a Protestant oath"],"a":1,"e":"Madison shepherded it through the legislature after years of petition campaigns by Baptists and Presbyterians. Disestablishment spread unevenly — Massachusetts kept a tax-supported Congregational establishment until 1833."},{"q":"Pennsylvania's 1780 abolition law is best described as","o":["Gradual emancipation freeing children born to enslaved mothers only after a long term of service","A colonization plan resettling freed people outside the state","Immediate emancipation of all enslaved people in the state","A ban on importing enslaved people that left existing slavery untouched"],"a":0,"e":"Gradual emancipation was the northern pattern. Children born after the law served until age 28, and nobody already enslaved was freed, so the census still recorded 64 enslaved people in Pennsylvania in 1840; the state ended slavery outright only in 1847. New York in 1799 and New Jersey in 1804 followed similar schedules."},{"q":"Which state's revolutionary-era constitution allowed some women to vote?","o":["Virginia","New Jersey","Pennsylvania","Massachusetts"],"a":1,"e":"New Jersey's 1776 constitution enfranchised all inhabitants worth £50, which in practice included unmarried and widowed propertied women and some free Black men. The legislature restricted the franchise to white men in 1807."},{"q":"In 'On the Equality of the Sexes' (1790), Judith Sargent Murray argued that","o":["Women's proper role was confined to household management","Coeducation would undermine republican virtue","Women should be granted the vote in every state","Gaps between male and female achievement stemmed from unequal education rather than innate capacity"],"a":3,"e":"Murray's case was about intellectual capacity and access to schooling, not suffrage. It sits alongside Benjamin Rush's arguments for educating women as mothers of future citizens."},{"q":"Most state constitutions written between 1776 and 1780 shared which feature?","o":["Property requirements abolished for voting and officeholding alike","Lifetime judicial appointments made by the governor","Strong legislatures, weak executives, and written bills of rights","Powerful governors with broad veto authority"],"a":2,"e":"Colonial experience with royal governors made executive power suspect. Massachusetts in 1780 was the partial exception, giving its governor a veto — and it was drafted by a convention and ratified by voters, a procedural model the federal convention later borrowed."},{"q":"The founding of Richard Allen's Bethel church in Philadelphia and Prince Hall's African Masonic Lodge in Boston both illustrate","o":["Free Black Americans building independent institutions in response to exclusion from white ones","Federal support for free Black institutions","The success of gradual emancipation in the Deep South","State-funded education for formerly enslaved people"],"a":0,"e":"Allen and others walked out of St. George's Methodist church over segregated seating; Bethel followed in 1794, and the African Methodist Episcopal denomination formed in 1816. Institution-building was the practical form Black claims to revolutionary equality took."},{"q":"For most Native nations, the most immediate consequence of the Revolution was","o":["Formal recognition of their sovereignty in the Treaty of Paris","The transfer of vast territory to the United States without their participation or consent","A guarantee of permanent hunting rights east of the Mississippi","Their admission as voting members of the Confederation Congress"],"a":1,"e":"Britain ceded land to the Mississippi in 1783 without consulting the nations who lived there. The Iroquois Confederacy had already fractured over the war, and Sullivan's 1779 campaign destroyed about forty Haudenosaunee towns."},{"q":"Several states abolished primogeniture and entail after independence. These reforms","o":["Prohibited the sale of western land to speculators","Removed legal restrictions that had kept large estates intact across generations","Ended property qualifications for voting","Redistributed all large estates to landless farmers"],"a":1,"e":"A modest but real change: estates could now be divided among heirs rather than passing whole to the eldest son. Jefferson championed it in Virginia as an attack on aristocratic landholding, though its practical effect was limited."},{"q":"The French Declaration of the Rights of Man and of the Citizen (1789) reflects American influence most directly through","o":["Lafayette's drafting work, developed in consultation with Jefferson in Paris","A formal treaty requiring France to adopt American principles","Its verbatim adoption of the US Bill of Rights","Washington's diplomatic mission to the National Assembly"],"a":0,"e":"Lafayette had served in the Continental Army and worked on drafts with Jefferson, then US minister to France. Note the chronology: the French document precedes the US Bill of Rights by two years."},{"q":"The Haitian Revolution, begun in 1791, affected the United States most significantly by","o":["Prompting immediate US recognition of Haitian independence","Persuading Congress to abolish slavery in the Southwest Territory","Alarming southern planters and contributing to France's decision to sell Louisiana","Ending the internal slave trade within the United States"],"a":2,"e":"French losses in Saint-Domingue made Napoleon's American empire untenable, which fed the 1803 sale. The United States withheld diplomatic recognition of Haiti until 1862."}]},{"n":"The Articles of Confederation","d":"Topic 3.7 · structure, land policy, diplomacy, crisis","Q":[{"s":"Articles of Confederation, Article II, drafted 1777","t":"Each state retains its sovereignty, freedom, and independence, and every power, jurisdiction, and right, which is not by this Confederation expressly delegated to the United States, in Congress assembled.","q":"This article most directly reflects","o":["A commitment to a strong central government","The supremacy of federal law over state law","A plan to abolish state governments over time","A league of largely sovereign states with a deliberately weak center"],"a":3,"e":"The Articles created what the document itself calls a firm league of friendship. The word 'expressly' is the key: it narrowed national authority far more tightly than the later Tenth Amendment, which omits it."},{"q":"Final ratification of the Articles was delayed until 1781 primarily because","o":["Congress could not agree on a national capital","Maryland refused to ratify until states with western land claims ceded them to Congress","Georgia demanded a guarantee protecting the slave trade","New York insisted on proportional representation"],"a":1,"e":"Maryland, with no western claims of its own, held out until Virginia agreed to cede. That cession created the national domain the land ordinances later organized."},{"q":"Under the Articles, amending the document required","o":["The unanimous consent of all thirteen states","Approval by nine of the thirteen states","A two-thirds vote of Congress","A national referendum"],"a":0,"e":"Unanimity for amendment, nine of thirteen for major legislation such as declaring war or coining money. The unanimity rule is why reform attempts failed and why Philadelphia ultimately bypassed the process entirely."},{"q":"To raise revenue, the Confederation Congress could only","o":["Request requisitions from the states, which frequently went unpaid","Compel state courts to collect federal excises","Impose tariffs on imported goods","Levy a direct tax on property"],"a":0,"e":"States paid a fraction of what was asked. Efforts to add a 5 percent national impost failed in 1781 and 1783 — blocked by Rhode Island and then New York, since amendment required every state."},{"q":"The Land Ordinance of 1785 provided that","o":["All western land would be given free to veterans of the Continental Army","Territories would be governed permanently from Philadelphia","Land could be purchased only by residents of the state claiming it","Western land would be surveyed into townships of 36 sections, with one reserved to support public schools"],"a":3,"e":"The rectangular survey grid it created still shapes the layout of the Midwest. Minimum purchase sizes and prices favored speculators over small farmers."},{"q":"Under the Northwest Ordinance of 1787, a territory could apply for statehood once it had","o":["Sixty thousand free inhabitants","A functioning state militia of one thousand men","Thirty thousand residents of any status","Ratified the Articles of Confederation"],"a":0,"e":"Three stages: a congressionally appointed governor and judges, then an elected assembly at 5,000 free adult males, then statehood at 60,000 free inhabitants. The ordinance also guaranteed trial by jury and religious freedom and promised good faith toward Native nations, a promise routinely broken."},{"q":"Which grievance persisted after the Treaty of Paris of 1783?","o":["Britain refused to recognize American independence","Britain kept military posts in the Northwest, citing American failure to honor debt and Loyalist provisions","France demanded the return of Louisiana","Spain occupied Georgia"],"a":1,"e":"The treaty's obligations ran both ways, and states blocked British creditors and Loyalist property claims. The posts remained until Jay's Treaty in 1794."},{"q":"Spain's decision to close the lower Mississippi to American shipping in 1784 mattered because","o":["It ended all US trade with the Caribbean","It triggered an immediate declaration of war","It violated the Northwest Ordinance","It cut off the export route for western farmers, and the proposed Jay–Gardoqui Treaty inflamed sectional anger by conceding it"],"a":3,"e":"John Jay was willing to trade Mississippi navigation for commercial access to Spanish ports. Southern and western delegates were furious, the treaty was never ratified, and the episode exposed how sectional divisions paralyzed the Confederation."},{"q":"The Annapolis Convention of 1786","o":["Drew delegates from only five states and issued a call for a broader convention in Philadelphia","Ratified the Treaty of Paris","Settled the dispute over western land cessions","Drafted the Constitution"],"a":0,"e":"Called to address interstate commercial conflicts, it drew just twelve delegates from five states — too thin to accomplish anything, so Hamilton and Madison used it to summon the May 1787 meeting."},{"q":"During the Newburgh conspiracy of 1783, army officers","o":["Threatened action against Congress over unpaid wages and pensions until Washington personally intervened","Petitioned for land grants in the Northwest Territory","Refused to disband until Britain evacuated New York","Demanded the appointment of a king"],"a":0,"e":"Washington's appearance before the officers, including the moment he reached for his spectacles, defused it. The episode is cited both as an early demonstration of civilian control of the military and as evidence of how little Congress could deliver."}]},{"n":"The convention and ratification","d":"Topic 3.8 · plans, compromises, Federalists and Anti-Federalists","Q":[{"q":"The Virginia Plan proposed","o":["A bicameral legislature with representation in both houses based on population","A unicameral legislature with one vote per state","An executive council of three members chosen by the states","Retaining the Articles with added commercial powers"],"a":0,"e":"Drafted largely by Madison and introduced by Randolph, it set the convention's agenda from the first week. Proportional representation in both houses favored the populous states."},{"q":"William Paterson's New Jersey Plan responded by proposing","o":["A property requirement for federal officeholding","Direct election of senators","Abolition of the states as political units","Equal representation for each state, as under the Articles"],"a":3,"e":"Small states feared being swallowed by Virginia, Pennsylvania and Massachusetts. The plan kept a unicameral congress with equal state votes while adding taxing and commercial powers."},{"q":"The Great Compromise resolved this conflict by","o":["Alternating representation schemes every ten years","Giving each state two votes in the House and one in the Senate","Leaving apportionment to the president","Creating a House apportioned by population and a Senate with equal state representation"],"a":3,"e":"Associated with Roger Sherman and the Connecticut delegation. It also specified that revenue bills originate in the House, a concession to the large states."},{"q":"The Three-Fifths Compromise applied to","o":["Eligibility for the presidency","Representation in the House and the apportionment of direct taxes","The distribution of western land","Representation in the Senate only"],"a":1,"e":"Counting three-fifths of the enslaved population inflated southern representation in the House and the Electoral College for decades. The formula came from a failed 1783 amendment to the Articles."},{"q":"On the international slave trade, the convention agreed that","o":["Each state could set its own policy permanently","It would be abolished immediately upon ratification","Congress could not prohibit it before 1808","It would continue under federal license indefinitely"],"a":2,"e":"A twenty-year shield, paired with a ban on export taxes, secured Deep South support. Congress acted at the first legal opportunity and the ban took effect January 1, 1808."},{"q":"Delegates conducted the convention's proceedings in secret, which means that","o":["No record of the debates survives","Madison's detailed notes are the principal record historians rely on","The debates were published daily in Philadelphia newspapers","Only Washington was permitted to take notes"],"a":1,"e":"Windows were shuttered and delegates sworn to silence so positions could shift without public commitment. Madison's notes were published only after his death in 1836."},{"q":"Which statement about attendance at the convention is accurate?","o":["All thirteen states sent delegations","Rhode Island sent the largest delegation","Jefferson presided over the debates","Jefferson and Adams were both abroad, and Patrick Henry refused to attend"],"a":3,"e":"Jefferson was minister to France and Adams to Britain. Henry declined, reportedly saying he smelt a rat, and Rhode Island refused to send anyone at all."},{"q":"The Federalist essays were written primarily to","o":["Serve as the convention's official minutes","Persuade voters and convention delegates in New York to ratify","Respond to British criticism of the new government","Outline Washington's plans for his first administration"],"a":1,"e":"Hamilton, Madison and Jay wrote 85 essays as Publius for New York newspapers, where ratification was seriously in doubt. Their standing as authoritative constitutional interpretation came later."},{"q":"Anti-Federalist opposition drew its greatest strength from","o":["Backcountry and small farmers wary of distant government and heavy taxation","Coastal merchants and large creditors","Continental Army officers","Urban artisans in port cities"],"a":0,"e":"The geography is fairly consistent: support for ratification clustered along the coast and in commercial centers, opposition inland. Artisans and merchants generally favored a government able to regulate trade."},{"q":"The Constitution took effect when","o":["Washington was inaugurated","All thirteen states had ratified","Congress declared it operative by a two-thirds vote","New Hampshire became the ninth state to ratify, in June 1788"],"a":3,"e":"Nine of thirteen was the threshold, and ratification ran through special conventions rather than legislatures. Virginia and New York followed narrowly; Rhode Island held out until 1790, after the government was already running."}]},{"n":"The Constitution","d":"Topic 3.9 · structure, powers, checks, the Bill of Rights","Q":[{"q":"The supremacy clause of Article VI provides that","o":["The Supreme Court may amend the Constitution","States must obtain congressional approval for their constitutions","Federal law and treaties take precedence over conflicting state law","The president may override any state law"],"a":2,"e":"It is the hinge of federalism, resolving conflicts between two levels of government that each act directly on citizens. It does not give federal authority over subjects the Constitution leaves to the states."},{"q":"The necessary and proper clause is significant because it","o":["Grants the president emergency authority","Limits Congress strictly to its enumerated powers","Provides the basis for implied powers, and became the core of the debate over the national bank","Requires that all laws be approved by the states"],"a":2,"e":"Hamilton read it broadly to justify the Bank of the United States in 1791; Jefferson and Madison read it narrowly, arguing necessary meant indispensable. The dispute defined the first party system and was settled in Hamilton's favor in McCulloch v. Maryland, 1819."},{"q":"An amendment proposed by a two-thirds vote of both houses takes effect when ratified by","o":["Two-thirds of the states","All of the states","Three-fourths of the states","A simple majority of the states"],"a":2,"e":"Three-fourths, by state legislatures or conventions. Deliberately hard, but far easier than the unanimity the Articles required — one of the clearest fixes the Constitution made."},{"q":"The Tenth Amendment provides that","o":["Powers not delegated to the United States are reserved to the states or the people","The enumeration of rights does not deny others retained by the people","Trials must be by jury","Congress may not establish a religion"],"a":0,"e":"Note the difference from Article II of the Articles: the Tenth Amendment drops the word 'expressly,' leaving room for implied powers. The last option describes the Ninth Amendment."},{"q":"Which power belongs to the Senate alone?","o":["Declaring war","Originating revenue bills","Confirming appointments and ratifying treaties by a two-thirds vote","Impeaching federal officials"],"a":2,"e":"The House originates revenue bills and votes impeachment; the Senate then tries impeachments and holds the advice-and-consent power. Declaring war takes both chambers."},{"q":"The Constitution's treatment of slavery is notable in that","o":["It never uses the words slave or slavery, relying on phrases like other Persons","It bans the word slavery from state constitutions","It grants Congress explicit power to abolish slavery in the states","It sets a national emancipation date of 1808"],"a":0,"e":"The circumlocutions were deliberate. Three clauses nonetheless protected the institution: three-fifths representation, the twenty-year slave-trade shield, and the fugitive slave clause."},{"q":"The Electoral College was adopted largely because delegates","o":["Distrusted both direct popular election and selection by Congress, and sought a compromise between them","Intended to guarantee a two-party system","Wanted the states to have no role in presidential selection","Were required to follow the Virginia Plan on this point"],"a":0,"e":"Congressional selection risked making the executive dependent on the legislature; direct election troubled delegates who doubted a national electorate could judge candidates. The three-fifths clause also gave slaveholding states added weight in the resulting formula."},{"q":"The Bill of Rights was ratified in","o":["1791","1789","1787","1795"],"a":0,"e":"Madison drafted the amendments in the First Congress in 1789; ten were ratified by the states in 1791. Two of the original twelve proposals failed, one of which was finally ratified in 1992 as the Twenty-Seventh Amendment."},{"q":"The Judiciary Act of 1789 was necessary because the Constitution","o":["Assigned judicial power entirely to state courts","Prohibited any federal courts below the state level","Gave the president authority to design the court system","Explicitly created only the Supreme Court, leaving lower federal courts to Congress"],"a":3,"e":"Article III creates one Supreme Court and authorizes such inferior courts as Congress may establish. The 1789 act built the district and circuit courts and created the attorney general's office."},{"q":"Which pair correctly matches a constitutional principle with an example?","o":["Popular sovereignty — the House of Representatives elected directly by voters","Separation of powers — the requirement that three-fourths of states ratify amendments","Federalism — the president's power to veto legislation","Checks and balances — the division of powers between national and state governments"],"a":0,"e":"Direct election of the House was the one federal office chosen by voters in 1789. The other options swap their principles: the veto is a check, the national and state division is federalism, and amendment ratification reflects federalism rather than separation of powers."}]},{"n":"Shaping a new republic","d":"Topic 3.10 · Hamilton's program, the first party system, foreign crises","Q":[{"q":"The central elements of Hamilton's financial program were","o":["Immediate repayment of all debts in specie and abolition of tariffs","Assumption of state debts, funding the national debt at face value, a national bank, and protective tariffs with an excise tax","A national property tax and the elimination of state banks","Distribution of western land to veterans in place of cash payment"],"a":1,"e":"The aim was to bind creditors' interests to the new government's survival. Madison objected that funding at face value rewarded speculators who had bought depreciated certificates from original holders."},{"q":"The Compromise of 1790 resolved the assumption fight by","o":["Locating the permanent capital on the Potomac in return for southern votes for assumption","Abandoning assumption in exchange for a national bank","Granting Virginia exemption from federal taxation","Postponing all debt payments until 1800"],"a":0,"e":"Jefferson later described brokering the bargain over dinner with Hamilton and Madison. Southern states with smaller remaining debts had little to gain from assumption otherwise."},{"q":"Jefferson's constitutional objection to the Bank of the United States rested on","o":["The claim that banks were prohibited by the Bill of Rights","Strict construction — the power to charter a bank is not enumerated in the Constitution","The argument that only states could coin money","The belief that the bank would be controlled by Britain"],"a":1,"e":"Hamilton answered with the necessary and proper clause and the doctrine of implied powers. Washington sided with Hamilton and signed the charter in 1791."},{"q":"The Whiskey Rebellion of 1794 differed from Shays's Rebellion in that","o":["It succeeded in repealing the tax","It occurred in New England","It was larger in scale","The federal government suppressed it decisively, with Washington leading a militia force of roughly thirteen thousand"],"a":3,"e":"The contrast is the point: the new government could do what the Confederation could not. Jeffersonians read the show of force as evidence of an overbearing central state."},{"q":"Washington's Proclamation of Neutrality in 1793 responded to","o":["The Haitian Revolution","War between Britain and revolutionary France, and the question of whether the 1778 alliance obliged American support","British impressment of American sailors in the Mediterranean","A Spanish blockade of New Orleans"],"a":1,"e":"Citizen Genêt's recruitment of American privateers made the crisis acute. Neutrality split the cabinet and hardened the emerging Federalist and Democratic-Republican division."},{"q":"Jay's Treaty of 1794 was controversial because","o":["It allied the United States with France","It ceded American claims to the Ohio valley","It abolished all trade with Britain","It secured British evacuation of the northwestern posts but won little on impressment or neutral shipping rights"],"a":3,"e":"Jeffersonians saw it as capitulation to Britain and betrayal of France. It did avoid a war the young republic could not afford, and it prompted Spain to settle on favorable terms in Pinckney's Treaty of 1795."},{"q":"Pinckney's Treaty of 1795 gained for the United States","o":["The purchase of Louisiana","Spanish recognition of American claims to Texas","A military alliance with Spain","The right of deposit at New Orleans and navigation of the Mississippi, plus a favorable Florida boundary"],"a":3,"e":"It answered the grievance the failed Jay–Gardoqui negotiations had inflamed a decade earlier, and it did more than anything else to bind western farmers to the national government."},{"q":"Washington's Farewell Address warned principally against","o":["The expansion of slavery into the territories","Westward migration","A national bank","Permanent foreign alliances and the divisive effects of political parties and sectionalism"],"a":3,"e":"The warning about parties was already overtaken by events — parties were forming as he wrote. The caution against permanent alliances shaped foreign-policy rhetoric for over a century."},{"q":"The XYZ Affair led directly to","o":["The Embargo Act","The Louisiana Purchase","An undeclared naval Quasi-War with France and a surge of anti-French feeling","A formal declaration of war on Britain"],"a":2,"e":"French agents' demand for a bribe before negotiations outraged American opinion. Federalists used the crisis to expand the navy and to pass the Alien and Sedition Acts."},{"q":"The Virginia and Kentucky Resolutions of 1798 and 1799 argued that","o":["Federal courts should be abolished","The Supreme Court alone could review federal statutes","States could judge the constitutionality of federal laws and interpose against or nullify them","The Alien and Sedition Acts should be repealed by a two-thirds vote of Congress"],"a":2,"e":"Written secretly by Madison and Jefferson against the Alien and Sedition Acts. No other state endorsed them, but the compact theory they advanced was revived in the nullification and secession crises."}]},{"n":"Identity, migration and society","d":"Topics 3.11 and 3.12 · American identity, the West, and the early republic's peoples","Q":[{"q":"The idea of American exceptionalism in the 1790s rested largely on the belief that","o":["The United States was uniquely favored by climate","The nation would remain agricultural forever","The republic represented a new political experiment in liberty that might serve as a model to the world","Americans were racially distinct from Europeans"],"a":2,"e":"Washington and others spoke of the republic as an experiment whose failure would discredit self-government everywhere. Crèvecoeur's question about what an American is comes from the same moment."},{"q":"Efforts to build a distinctly American culture after independence included","o":["Noah Webster's spellers and dictionaries, which standardized American usage and spelling","The establishment of an official national church","A ban on the importation of European books","A federal ministry of culture"],"a":0,"e":"Webster argued that a republic needed its own language standard. The same impulse produced Charles Willson Peale's portraits, Mercy Otis Warren's history and a neoclassical architectural vocabulary for public buildings."},{"q":"Why did Washington, D.C., and other public buildings adopt neoclassical design?","o":["Greek and Roman forms visually linked the new republic to classical models of self-government","It reflected the preferences of British architects","It was the cheapest available style","It was mandated by the Constitution"],"a":0,"e":"Jefferson's Virginia State Capitol, modeled on a Roman temple, is the clearest case. The same classicism shows up in the vocabulary of the era — senate, capitol, and the pen name Publius."},{"q":"Migration into the trans-Appalachian West after 1790 was driven mainly by","o":["Industrial employment in western cities","The availability of land, aided by the land ordinances, Pinckney's Treaty, and the defeat of Native resistance at Fallen Timbers","The collapse of eastern agriculture","Federal orders relocating eastern populations"],"a":1,"e":"Kentucky entered the Union in 1792 and Tennessee in 1796. Secure Mississippi access made western farming economically viable by giving crops a route to market."},{"q":"The Battle of Fallen Timbers (1794) and the Treaty of Greenville (1795) resulted in","o":["Recognition of a permanent Native homeland east of the Mississippi","A formal alliance between the United States and the Western Confederacy","Native cession of most of present-day Ohio and a temporary halt to armed resistance in the region","The removal of all federal troops from the Northwest"],"a":2,"e":"Little Turtle and Blue Jacket had defeated two earlier American expeditions, including St. Clair's disastrous loss in 1791. Britain's refusal to support the confederacy after Jay's Treaty left it exposed."},{"q":"Which statement about slavery in the 1790s is accurate?","o":["Eli Whitney's cotton gin, patented in 1794, made short-staple cotton profitable and gave slavery new economic vitality in the South","It was declining steadily in every region","Congress abolished the internal slave trade","Manumission became illegal throughout the South"],"a":0,"e":"This is the hinge between Period 3 and Period 4. Upper South manumissions slowed and then reversed as cotton spread through the interior South."},{"q":"Gabriel's Rebellion, a planned uprising near Richmond in 1800, is significant because it","o":["Succeeded in freeing several hundred enslaved people","Led directly to the abolition of slavery in Virginia","Showed enslaved people applying revolutionary and Haitian rhetoric, and prompted harsher restrictions in Virginia","Was supported by the state legislature"],"a":2,"e":"Gabriel, a literate blacksmith, drew on the same natural-rights vocabulary white Virginians used. The plot was betrayed before it began, and the state responded by tightening controls on free and enslaved Black people alike."},{"q":"Immigration and naturalization in the 1790s became politically charged because","o":["Immigrants were barred from the West","No naturalization procedure existed","The Constitution prohibited naturalization","Recent arrivals tended to support the Democratic-Republicans, and the Federalist-backed Naturalization Act of 1798 extended the residency requirement to fourteen years"],"a":3,"e":"The Alien and Sedition Acts were partly a partisan instrument aimed at a Republican-leaning constituency. Jefferson's administration restored a five-year requirement in 1802."},{"q":"Free Black communities in northern cities in the 1790s","o":["Were legally identical to white communities in every respect","Were barred from forming organizations of any kind","Built churches, schools and mutual aid societies while facing job discrimination and, in most states, disenfranchisement","Held a majority of the urban population"],"a":2,"e":"The Free African Society in Philadelphia, founded in 1787 by Absalom Jones and Richard Allen, is the standard example. Several states that initially permitted Black voting later restricted it."},{"q":"The election of 1800 is often called a revolution because","o":["It ended the party system","It produced the first peaceful transfer of power between opposing parties in the new republic","It was decided by the Supreme Court","It resulted in a constitutional convention"],"a":1,"e":"The tie between Jefferson and Burr pushed the contest into the House and produced the Twelfth Amendment in 1804. That power changed hands without violence was the genuinely novel part."}]},{"n":"Cumulative review","d":"Topics 3.1 to 3.13 · causation, comparison, chronology across 1754 to 1800","Q":[{"s":"James Madison, Federalist No. 10, 1787","t":"The latent causes of faction are thus sown in the nature of man… But the most common and durable source of factions has been the various and unequal distribution of property. Those who hold and those who are without property have ever formed distinct interests in society.","q":"Madison's proposed remedy for the danger he describes was to","o":["Give the executive power to dissolve political societies","Restrict voting to property holders in every state","Eliminate the causes of faction by equalizing property","Extend the republic over a large territory so no single faction could form a majority"],"a":3,"e":"Madison held that destroying the causes of faction would require destroying liberty itself, so the answer is to control its effects. Extending the sphere multiplies competing interests."},{"q":"Which sequence is correctly ordered?","o":["Northwest Ordinance, Articles ratified, Land Ordinance, Constitution ratified, Bill of Rights ratified","Articles ratified, Land Ordinance, Northwest Ordinance, Constitution ratified, Bill of Rights ratified","Land Ordinance, Articles ratified, Constitution ratified, Northwest Ordinance, Bill of Rights ratified","Articles ratified, Northwest Ordinance, Land Ordinance, Bill of Rights ratified, Constitution ratified"],"a":1,"e":"1781, 1785, 1787, 1788, 1791. Worth noting that the Northwest Ordinance and the Constitutional Convention ran concurrently in the summer of 1787 — the Confederation Congress in New York, the convention in Philadelphia."},{"q":"Which best explains why the Confederation government could organize an enormous western domain yet not pay its own soldiers?","o":["The Treaty of Paris barred federal spending on the military","The states refused to recognize the Northwest Territory","Congress controlled the national land domain but had no independent power of taxation","Land sales were prohibited until after 1790"],"a":2,"e":"This contrast is the standard framing for the Articles: real achievement in land policy, structural failure in finance. Land sales were themselves an attempt to raise revenue without taxes."},{"q":"A historian arguing that the Revolution's egalitarian promise was sharply limited would most likely cite","o":["The Virgin
